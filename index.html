<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Storyboard Stage</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#15161a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Storyboard">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
:root{
  --panel:#f3f4f2; --panel-2:#e3e5e1; --card:#fbfbfa; --ink:#15181a; --ink-2:#5d6460; --line:#d3d7d2;
  --tape:#f5c400; --tape-ink:#16150f; --danger:#c2362b;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --panel:#17191b; --panel-2:#23262a; --card:#1d2023; --ink:#eceeea; --ink-2:#98a09a; --line:#2e3236;
    --tape:#f5c400; --tape-ink:#16150f; --danger:#ff6b5e;
    color-scheme: dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#15161a;color:var(--ink);
  font:14px/1.35 "Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--tape);outline-offset:2px}

#app{position:fixed;left:0;top:0;width:100vw;height:100vh;width:100dvw;height:100dvh;overflow:hidden;
  --pw:clamp(290px,calc(var(--aw,100vw)*.34),400px)}
/* Portrait phones: rotate the whole app a quarter turn so it always runs horizontally */
html.rot #app{width:var(--aw);height:var(--ah);transform-origin:0 0;transform:rotate(90deg) translateY(-100%)}
html.compact .stick{width:98px;height:98px;bottom:12px}
html.compact .stick .knob{width:40px;height:40px;margin:-20px 0 0 -20px}
html.compact .tiltpad{bottom:12px}
html.compact .tiltpad button{height:40px}
html.compact #tabs button{padding:10px 2px 8px}
#modeSeg .sm{display:none}
html.compact #modeSeg .lg{display:none}
html.compact #modeSeg .sm{display:inline}
html.compact .topbar{top:6px;left:6px;right:6px;gap:6px}
html.compact .seg button{padding:7px 9px;font-size:12px}
html.compact .tbtn{padding:8px 10px;font-size:12px}
html.compact .tbtn.sq{min-width:34px;padding:8px 0}
html.compact .shotbtn{padding:8px 11px;font-size:12px}
html.compact .topright{gap:6px}
html.compact #presetBar button{padding:7px 12px;font-size:12px}
html.compact #panel{right:6px;bottom:6px}
html.compact .shot{grid-template-columns:104px minmax(0,1fr)}

/* ---------- stage ---------- */
#stage{position:absolute;inset:0;background:#15161a;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.topbar{position:absolute;top:10px;left:10px;right:10px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.topbar>*{pointer-events:auto}
.seg{display:flex;background:var(--panel-2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 10px;border-radius:8px;font-weight:600;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.22)}
.seg.glass{background:rgba(18,19,22,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.seg.glass button{color:#aeb4b0}
.seg.glass button.on{background:#f1f2ee;color:#15181a}
.shotbtn{display:flex;align-items:center;gap:8px;background:var(--tape);color:var(--tape-ink);padding:10px 14px;border-radius:10px;font-weight:700;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.shotbtn:active{transform:translateY(1px)}
.shotbtn i{width:10px;height:10px;border-radius:50%;background:var(--tape-ink);display:block}

#frame{position:absolute;pointer-events:none;display:none;border:1px solid rgba(255,255,255,.4);color:#fff;
  font:11px/1.2 ui-monospace,"SF Mono",Menlo,Consolas,monospace;text-shadow:0 1px 2px rgba(0,0,0,.8)}
#stillImg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;pointer-events:none}
#frame .g{position:absolute;background:rgba(255,255,255,.28);display:none}
#frame.thirds .g{display:block}
#frame .v1{left:33.333%;top:0;bottom:0;width:1px}
#frame .v2{left:66.666%;top:0;bottom:0;width:1px}
#frame .h1{top:33.333%;left:0;right:0;height:1px}
#frame .h2{top:66.666%;left:0;right:0;height:1px}
#frame .tl{position:absolute;left:8px;top:7px;display:flex;align-items:center;gap:6px}
#frame .tl i{width:8px;height:8px;border-radius:50%;background:#ff4a3d;display:block}
#frame .bl{position:absolute;left:8px;bottom:7px}
#vlabel{position:absolute;right:12px;bottom:10px;color:#cfd3cf;font:11px/1.2 ui-monospace,Menlo,Consolas,monospace;text-shadow:0 1px 2px #000;pointer-events:none;display:none}
.topright{display:flex;flex-wrap:wrap;justify-content:flex-end;margin-left:auto;gap:8px;align-items:center}
.tbtn:disabled{opacity:.35;cursor:default}
.tbtn.sq{min-width:40px;padding:10px 0;font-size:16px;line-height:1}
.tbtn{background:rgba(18,19,22,.78);color:#e8eae6;padding:10px 12px;border-radius:10px;font-weight:600;font-size:13px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);white-space:nowrap}
.tbtn.on{background:#f1f2ee;color:#15181a}
.fitbtn{background:rgba(18,19,22,.78);color:#e8eae6;padding:10px 12px;border-radius:10px;font-weight:600;font-size:13px;display:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#pip{position:absolute;display:none;border:2px solid var(--tape);border-radius:3px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.5)}
#pip span{position:absolute;left:4px;top:3px;font:10px/1 ui-monospace,Menlo,Consolas,monospace;color:#fff;text-shadow:0 1px 2px #000}
#hint{position:absolute;left:10px;top:calc(var(--tb,48px) + 56px);max-width:calc(100% - 214px);background:rgba(18,19,22,.82);color:#e8eae6;padding:8px 12px;border-radius:999px;
  font-size:12px;white-space:nowrap;opacity:0;transition:opacity .25s;pointer-events:none;max-width:94%;overflow:hidden;text-overflow:ellipsis}
#hint.show{opacity:1}


/* preset strip + minimap */
#presetBar{position:absolute;top:calc(var(--tb,48px) + 10px);left:10px;right:196px;display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:2px 2px 6px;z-index:6;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x}
#presetBar::-webkit-scrollbar{display:none}
#presetBar button{flex:0 0 auto;border-radius:999px;padding:9px 14px;font-weight:600;font-size:13px;background:rgba(18,19,22,.82);color:#e8eae6;white-space:nowrap;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#presetBar button.pcat{background:rgba(245,196,0,.2);color:#f5c400}
#presetBar button.pcat.on{background:#f5c400;color:#15161a}
#presetBar button.pchip.on{background:#f1f2ee;color:#15181a}
#presetBar .psep{flex:0 0 1px;background:rgba(255,255,255,.3);margin:6px 2px}
#mini{position:absolute;top:calc(var(--tb,48px) + 10px);right:10px;width:176px;height:108px;border-radius:12px;background:rgba(18,19,22,.84);border:1px solid rgba(255,255,255,.18);overflow:hidden;z-index:7;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#miniCv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:pointer}
#miniBtn{position:absolute;right:4px;bottom:4px;width:28px;height:28px;border-radius:8px;background:rgba(0,0,0,.6);color:#fff;font-size:15px;line-height:1}
#miniTag{position:absolute;left:8px;top:5px;font:600 10px/1 system-ui,sans-serif;color:rgba(255,255,255,.7);pointer-events:none;letter-spacing:.05em}
#presetList{position:absolute;top:calc(var(--tb,48px) + 56px);left:10px;z-index:9;display:none;flex-direction:column;gap:2px;min-width:180px;max-width:240px;max-height:calc(100% - 120px);overflow-y:auto;
  background:rgba(18,19,22,.92);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:6px;box-shadow:0 6px 18px rgba(0,0,0,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#presetList .phead{font:700 11px/1 system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#f5c400;padding:8px 10px 6px}
#presetList button{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:8px;font-weight:600;font-size:13px;color:#e8eae6}
#presetList button:hover{background:rgba(255,255,255,.08)}
#presetList button.on{background:#f1f2ee;color:#15181a}
#presetBar button.pcat.act{box-shadow:inset 0 0 0 2px #f5c400}
#stage.mode-build #presetBar{right:10px}
#stage.mode-build #mini,#stage.mode-build #shotBtn,#stage.mode-direct #presetBar,#stage.mode-direct #presetList,#stage.mode-direct #placebar{display:none!important}
#stage.clean #presetList,#stage.boardmode #presetList,
#stage.clean #mini,#stage.clean #presetBar,#stage.boardmode #mini,#stage.boardmode #presetBar{display:none!important}

/* ---------- FPV sticks ---------- */
#sticks{position:absolute;inset:0;pointer-events:none;display:none}
.stick{position:absolute;bottom:18px;width:116px;height:116px;border-radius:50%;pointer-events:auto;touch-action:none;
  background:radial-gradient(circle,rgba(255,255,255,.10) 0 34%,rgba(18,19,22,.42) 35%);border:2px solid rgba(255,255,255,.38)}
.stick::before,.stick::after{content:"";position:absolute;background:rgba(255,255,255,.22);pointer-events:none}
.stick::before{left:50%;top:10px;bottom:10px;width:1px}
.stick::after{top:50%;left:10px;right:10px;height:1px}
.stick .knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(245,196,0,.92);box-shadow:0 2px 8px rgba(0,0,0,.5);pointer-events:none}
.stick .cap{position:absolute;left:50%;transform:translateX(-50%);top:-20px;font-size:11px;color:rgba(255,255,255,.72);white-space:nowrap;text-shadow:0 1px 2px #000;pointer-events:none}
#stickL{left:14px}
#stickR{right:14px}
.mpad{position:absolute;bottom:14px;pointer-events:auto;touch-action:none;display:grid;gap:6px;user-select:none;-webkit-user-select:none}
#mpadMove{left:14px;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px)}
#mpadLift{right:14px;grid-template-columns:62px;grid-template-rows:48px 48px}
.mpad button{border-radius:12px;background:rgba(18,19,22,.72);color:#eef0ec;border:1px solid rgba(255,255,255,.28);font-size:17px;font-weight:700;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);touch-action:none}
.mpad.lift button{font-size:13px}
.mpad button.held{background:var(--tape);color:var(--tape-ink);border-color:var(--tape)}
.mpad .mid{display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.6);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
html.compact #mpadMove{grid-template-columns:repeat(3,42px);grid-template-rows:repeat(3,42px)}
html.compact #mpadLift{grid-template-rows:42px 42px}
#app.panelopen #mpadLift{right:calc(var(--pw) + 24px)}
.tiltpad{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:8px;pointer-events:auto}
.tiltpad button{width:58px;height:46px;border-radius:12px;background:rgba(18,19,22,.7);color:#e8eae6;font-size:12px;font-weight:600;border:1px solid rgba(255,255,255,.3);touch-action:none;line-height:1.1}
.tiltpad button.held{background:var(--tape);color:var(--tape-ink)}

/* ---------- panel ---------- */
/* floating glass panel, opened from the panel icon */
#panel{position:absolute;top:calc(var(--tb,48px) + 10px);right:10px;bottom:10px;width:var(--pw);z-index:20;display:none;flex-direction:column;min-height:0;overflow:hidden;
  border-radius:16px;border:1px solid var(--line);box-shadow:0 10px 32px rgba(0,0,0,.35);
  background:var(--glass);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);
  --glass:rgba(244,245,243,.52);--card:rgba(255,255,255,.42);--panel-2:rgba(20,24,22,.07);--line:rgba(20,24,22,.12)}
@media (prefers-color-scheme: dark){#panel{--glass:rgba(22,24,27,.5);--card:rgba(255,255,255,.06);--panel-2:rgba(255,255,255,.09);--line:rgba(255,255,255,.12)}}
#app.panelopen #panel{display:flex}
#app.uiclean #panel{display:none!important}
#panelBtn svg{width:18px;height:18px;display:block;margin:0 auto}
#app.panelopen #mini{right:calc(var(--pw) + 20px)}
#app.panelopen #stickR{right:calc(var(--pw) + 24px)}
#app.panelopen #stage.mode-build #presetBar{right:calc(var(--pw) + 20px)}
#stage.clean #modeSeg,#stage.clean #panelBtn{display:none!important}
#mViewSeg,#mTools{display:none}
#stage.mode-model #mViewSeg{display:flex}
#stage.mode-model #mTools{display:flex}
#stage.clean #mViewSeg,#stage.clean #mTools{display:none!important}
#mTools{position:absolute;left:10px;right:10px;bottom:10px;z-index:7;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none;padding:6px;border-radius:14px;background:rgba(18,19,22,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);touch-action:pan-x}
#mTools::-webkit-scrollbar{display:none}
#mTools button{flex:0 0 auto;padding:9px 12px;border-radius:9px;font-weight:600;font-size:12.5px;color:#e8eae6;background:rgba(255,255,255,.08);white-space:nowrap}
#mTools button[data-add]{background:rgba(245,196,0,.18);color:#f5c400}
#mTools button.warn{color:#ff6b5e}
#mTools .tl{color:#9aa09b;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:0 4px;flex:none}
#mTools .sep{flex:0 0 1px;align-self:stretch;background:rgba(255,255,255,.2);margin:4px 2px}
#app.panelopen #mTools{right:calc(var(--pw) + 20px)}
html.compact #mTools button{padding:7px 10px;font-size:12px}
#stage.mode-pose #viewSeg,#stage.mode-pose #presetBar,#stage.mode-pose #presetList,#stage.mode-pose #mini,#stage.mode-pose #shotBtn,#stage.mode-pose #pip,#stage.mode-pose #fitBtn,#stage.mode-pose #vlabel,#stage.mode-pose #placebar,#stage.mode-pose #sticks,#stage.mode-pose #frame,#stage.mode-pose #stickBtn,
#stage.mode-model #viewSeg,#stage.mode-model #presetBar,#stage.mode-model #presetList,#stage.mode-model #mini,#stage.mode-model #shotBtn,#stage.mode-model #pip,
#stage.mode-model #fitBtn,#stage.mode-model #vlabel,#stage.mode-model #placebar,#stage.mode-model #sticks,#stage.mode-model #frame,#stage.mode-model #stickBtn{display:none!important}
.mrow{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:var(--card)}
.mrow.on{box-shadow:inset 3px 0 0 var(--tape)}
.mrow .mhd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mrow .mhd b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .mhd span{color:var(--ink-2);font-size:12px;white-space:nowrap}
.mrow .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.mrow .acts button{padding:6px 10px;border-radius:8px;background:var(--panel-2);font-size:12px;font-weight:600}
.mrow .acts button.warn{color:var(--danger)}
.btn[disabled]{opacity:.45;cursor:default}
/* clean mode: only the picture, a Show button and a small record dot */
#stage.clean #undoBtn,#stage.clean #redoBtn,#stage.clean #viewSeg,#stage.clean .fitbtn,#stage.clean #stickBtn,#stage.clean #pip,#stage.clean #vlabel,#stage.clean #hint,#stage.clean #placebar,#stage.clean #sticks,#stage.clean #frame .tl,#stage.clean #frame .bl{display:none!important}
#stage.clean #shotBtn{padding:12px;font-size:0;gap:0}
#stage.clean #uiBtn{opacity:.6}
/* shots as nodes */
#board{position:absolute;inset:0;display:none;z-index:6;background-color:#15161a;
  background-image:radial-gradient(rgba(255,255,255,.09) 1.2px,transparent 1.4px);background-size:24px 24px;overflow:hidden}
#stage.boardmode #board{display:block}
#stage.boardmode #viewSeg,#stage.boardmode .fitbtn,#stage.boardmode #stickBtn,#stage.boardmode #pip,#stage.boardmode #frame,#stage.boardmode #sticks,#stage.boardmode #vlabel,#stage.boardmode #placebar,#stage.boardmode #hint{display:none!important}
#stage.boardmode .topbar{z-index:8;pointer-events:none}
#boardView{position:absolute;inset:0;touch-action:none;cursor:grab}
#boardWorld{position:absolute;left:0;top:0;transform-origin:0 0}
#wires{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none;color:var(--tape)}
#wires path{fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round}
#wires path.tmp{stroke-dasharray:6 6;opacity:.8}
#nodes{position:absolute;left:0;top:0}
.node{position:absolute;background:#1f2226;border:2px solid #343840;border-radius:12px;color:#eceeea;box-shadow:0 4px 14px rgba(0,0,0,.45);touch-action:none;user-select:none;-webkit-user-select:none}
.node.sel{border-color:var(--tape)}
.node.drop{border-color:#fff;box-shadow:0 0 0 3px rgba(245,196,0,.6)}
.node .thumb{position:relative;border-radius:10px 10px 0 0;overflow:hidden;background:#000}
.node .thumb img{width:100%;height:100%;display:block;object-fit:cover;pointer-events:none}
.node .num{position:absolute;left:6px;top:6px;background:var(--tape);color:var(--tape-ink);font-weight:800;font-size:12px;min-width:22px;height:22px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 6px}
.node .foot{padding:7px 10px 9px;font-size:12px;pointer-events:none}
.node .foot b{font-size:13px;margin-right:6px}
.node .foot span{color:#9aa09b}
.node .foot p{margin:4px 0 0;color:#c9ccc8;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:0}
.node .foot p:empty{display:none}
.port{position:absolute;width:26px;height:26px;border-radius:50%;background:#2b2f35;border:3px solid var(--tape);touch-action:none}
.port.in{left:-15px}
.port.out{right:-15px;cursor:crosshair;background:var(--tape)}
#boardBar{position:absolute;left:10px;top:calc(var(--tb,48px) + 10px);flex-wrap:wrap;right:200px;z-index:8;display:none;gap:6px;pointer-events:auto}
#stage.boardmode #boardBar{display:flex}
#boardEmpty{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#9aa09b;text-align:center;max-width:300px;pointer-events:none;display:none}
#boardSheet{position:absolute;left:10px;right:10px;bottom:10px;z-index:8;display:none;gap:10px;align-items:flex-start;background:rgba(24,26,29,.94);color:#eceeea;border:1px solid #343840;border-radius:12px;padding:10px;max-width:640px;margin:0 auto}
#boardSheet .col{flex:1;min-width:0}
#boardSheet .ttl{font-weight:700;font-size:13px;margin-bottom:6px}
#boardSheet textarea{width:100%;height:46px;resize:none;border-radius:8px;border:1px solid #3a3e45;background:#15161a;color:#eceeea;font:inherit;padding:8px}
#boardSheet .acts{display:flex;flex-wrap:wrap;gap:6px;width:180px;flex:none}
#boardSheet .acts button{padding:7px 9px;border-radius:8px;background:#2b2f35;font-size:12px;font-weight:600;flex:1 0 56px}
#boardSheet .acts button.warn{color:#ff6b5e}
html.compact #boardSheet textarea{height:38px}
/* sketch editor */
#inkEd{position:absolute;inset:0;z-index:30;display:none;flex-direction:column;background:#101113;color:#eceeea}
#inkEd .inkbar{display:flex;align-items:center;gap:10px;padding:8px 10px;justify-content:space-between;flex:none}
#inkEd .inkbar b{font-size:14px}
#inkEd .tools{justify-content:flex-start;flex-wrap:wrap;gap:8px 12px;border-top:1px solid #26292d}
#inkStage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px 10px}
#inkCv{touch-action:none;background:#000;box-shadow:0 4px 18px rgba(0,0,0,.6);cursor:crosshair}
#inkColors{display:flex;gap:8px}
#inkColors button{width:28px;height:28px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1px #555}
#inkColors button.on{border-color:#101113;box-shadow:0 0 0 3px var(--tape)}
#inkW{width:110px;accent-color:var(--tape)}
/* locations */
.loc{display:grid;grid-template-columns:104px minmax(0,1fr);gap:10px;padding:8px;border:1px solid var(--line);border-radius:12px;margin:8px 0;background:var(--card)}
.loc img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:6px;display:block;background:#000}
.loc .acts{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.loc .acts button{padding:6px 9px;border-radius:8px;background:var(--panel-2);font-size:12px;font-weight:600}
.loc .field{padding:7px 9px}


#tabs button.hide{display:none}
details.folder{border:1px solid var(--line);border-radius:12px;margin:8px 0;background:var(--card)}

<script>
(function(){
'use strict';
const D2R=Math.PI/180, R2D=180/Math.PI;
const $=(s,r=document)=>r.querySelector(s);
/* Claude features (AI models, matching a still) work only inside the published Claude page */
const HAS_AI=!!(window.claude&&typeof window.claude.use==='function');
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const stage=$('#stage'), canvas=$('#gl');

if(!window.THREE){ stage.innerHTML='<p style="color:#fff;padding:24px">Three.js could not be loaded. Check your connection and reload.</p>'; return; }

/* sRGB hex -> linear colour, so lit surfaces look the way their hex says */
const C=hex=>new THREE.Color(hex).convertSRGBToLinear();

/* ---------- landscape layout ---------- */
const root=document.documentElement;
let forceLandscape=true;
/* the phone's own bars (time, battery, notch, home bar): keep the app out from under them */
const safeProbe=document.createElement('div');
safeProbe.style.cssText='position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)';
document.body.appendChild(safeProbe);
const safe={t:0,r:0,b:0,l:0};
function readSafe(){const c=getComputedStyle(safeProbe);safe.t=parseFloat(c.paddingTop)||0;safe.r=parseFloat(c.paddingRight)||0;safe.b=parseFloat(c.paddingBottom)||0;safe.l=parseFloat(c.paddingLeft)||0;}
function applyLayout(){
  readSafe();
  const iw=window.innerWidth, ih=window.innerHeight;
  const rot=forceLandscape&&ih>iw&&iw<900;
  const app=document.getElementById('app');
  let aw,ah;
  if(rot){
    /* turned a quarter: the phone's top bar becomes the app's left edge, the home bar its right edge */
    aw=ih-safe.t-Math.min(safe.b,24); ah=iw-safe.l-safe.r;
    Object.assign(app.style,{left:safe.l+'px',top:'0px',width:aw+'px',height:ah+'px',transform:'translateY('+safe.t+'px) rotate(90deg) translateY(-100%)'});
  }else{
    aw=iw-safe.l-safe.r; ah=ih-safe.t-Math.min(safe.b,20);
    Object.assign(app.style,{left:safe.l+'px',top:safe.t+'px',width:aw+'px',height:ah+'px',transform:'none'});
  }
  root.classList.toggle('rot',rot);
  root.classList.toggle('compact',ah<=520);
  root.style.setProperty('--aw',aw+'px'); root.style.setProperty('--ah',ah+'px');
}
applyLayout();
window.addEventListener('resize',applyLayout);
window.addEventListener('orientationchange',applyLayout);
/* screen coordinates -> app coordinates (undoes the quarter turn when rotated) */
function toApp(cx,cy){return root.classList.contains('rot')?{x:cy-safe.t,y:window.innerWidth-safe.r-cx}:{x:cx-safe.l,y:cy-safe.t};}
function lp(e){const a=toApp(e.clientX,e.clientY);return {x:a.x-stage.offsetLeft,y:a.y-stage.offsetTop};}

/* =====================================================================
   Constants
   ===================================================================== */
const MAX_CHARS=4;
const PALETTE=['#e8590c','#0ca678','#7048e8','#f2c230','#e64980','#228be6'];
const DEFAULT_NAMES=['Alex','Blake','Casey','Drew'];
const SPOTS=[[-.8,-.3],[.8,-.5],[-.3,.8],[1.1,.6]];
const POSES={
  stand:{hipY:.94,rotX:0,lift:0,zs:0,thigh:0,knee:0,upper:.04,elbow:-.18,splay:.09,chair:0,labelY:2.08},
  sit:  {hipY:.50,rotX:0,lift:0,zs:0,thigh:-Math.PI/2,knee:Math.PI/2,upper:-.35,elbow:-1.15,splay:.12,chair:1,labelY:1.66},
  lay:  {hipY:.94,rotX:-Math.PI/2,lift:.12,zs:.875,thigh:0,knee:0,upper:0,elbow:-.05,splay:.14,chair:0,labelY:.62}
};
const POSE_KEYS=Object.keys(POSES.stand);

/* Blackmagic Pyxis 6K: full-frame 36 mm wide sensor. Every format uses the full sensor width. */
const SENSOR_W=36;
const ASPECTS={'3:2':3/2,'17:9':17/9,'16:9':16/9,'2.39:1':2.39};
const LENSES=[18,24,35,50,85,135,200];
const LENS_LEN={18:.06,24:.065,35:.07,50:.09,85:.12,135:.2,200:.28};
const LENS_R={18:.048,24:.045,35:.042,50:.042,85:.045,135:.05,200:.052};
const CAM_LIMIT=150, CAM_MAX_H=80;

/* =====================================================================
   Lighting model
   ===================================================================== */
const LIGHT_PRESETS={
  day:     {label:'Daylight',    key:{i:1.3,k:5600,az:40,el:55}, rim:{i:0,k:6500,az:-150,el:30}, fill:.75, sky:'#cfe3ff', gnd:'#8a8478', lamp:{i:0,k:2700},   ev:0,   bg:'#9cc4ec', ground:'#6f7a63'},
  golden:  {label:'Golden hour', key:{i:1.5,k:3200,az:75,el:12}, rim:{i:.4,k:7000,az:-110,el:25}, fill:.45, sky:'#ffd2a1', gnd:'#7a6450', lamp:{i:0,k:2700},   ev:.2,  bg:'#f0a870', ground:'#7a6a50'},
  overcast:{label:'Overcast',    key:{i:.25,k:7000,az:20,el:70}, rim:{i:0,k:6500,az:-150,el:30},  fill:1.15,sky:'#dfe6ee', gnd:'#9a9a96', lamp:{i:0,k:2700},   ev:.2,  bg:'#b8bec6', ground:'#7d8280'},
  night:   {label:'Night',       key:{i:.14,k:9500,az:-30,el:40},rim:{i:0,k:6500,az:-150,el:30},  fill:.14, sky:'#3a4a78', gnd:'#1c1f2a', lamp:{i:1.3,k:2700}, ev:.3,  bg:'#0b1020', ground:'#14181f'},
  studio:  {label:'Studio',      key:{i:1.4,k:5600,az:40,el:40}, rim:{i:.9,k:6500,az:200,el:35},  fill:.35, sky:'#ffffff', gnd:'#888888', lamp:{i:0,k:2700},   ev:0,   bg:'#1a1b1f', ground:'#202226'},
  moody:   {label:'Moody',       key:{i:1.7,k:3800,az:-70,el:30},rim:{i:.5,k:8000,az:160,el:20},  fill:.08, sky:'#202838', gnd:'#101216', lamp:{i:0,k:2700},   ev:-.2, bg:'#07080b', ground:'#0c0d10'}
};
const L={preset:'day',shadows:true,block:false,bright:false,lamp:{i:0,k:2700,x:0,z:0}};
function setPreset(n){
  const p=LIGHT_PRESETS[n]; L.preset=n;
  L.key=Object.assign({},p.key); L.rim=Object.assign({},p.rim); L.fill=p.fill; L.sky=p.sky; L.gnd=p.gnd;
  L.lamp.i=p.lamp.i; L.lamp.k=p.lamp.k; L.ev=p.ev; L.bg=p.bg; L.ground=p.ground;
}

/* Colour temperature (Kelvin) to RGB, approximation by Tanner Helland */
function kelvin(K){
  const t=K/100; let r,g,b;
  if(t<=66){r=255;g=99.4708025861*Math.log(t)-161.1195681661;b=t<=19?0:138.5177312231*Math.log(t-10)-305.0447927307;}
  else{r=329.698727446*Math.pow(t-60,-.1332047592);g=288.1221695283*Math.pow(t-60,-.0755148492);b=255;}
  const c=v=>clamp(v,0,255)/255; return new THREE.Color(c(r),c(g),c(b));
}

/* Two copies of the room: a "cutaway" with inward-facing walls (you can look in from outside)
   and a "solid" one with double-sided walls (you see the outside when the camera is outside). */
function makeShell(side){
  const mk=(color,rx,ry)=>{
    const m=new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.MeshStandardMaterial({color:C(color),roughness:.95,metalness:0,side}));
    m.receiveShadow=true; if(rx!==undefined)m.rotation.x=rx; if(ry!==undefined)m.rotation.y=ry; return m;
  };
  const s={group:new THREE.Group()};
  s.floor=mk(0x7d6c58,-Math.PI/2); s.ceil=mk(0xeae6de,Math.PI/2);
  s.back=mk(0xd9d3c9); s.front=mk(0xc7c1b7,undefined,Math.PI);
  s.left=mk(0xcec8be,undefined,Math.PI/2); s.right=mk(0xd3cdc3,undefined,-Math.PI/2);
  s.group.add(s.floor,s.ceil,s.back,s.front,s.left,s.right);
  scene.add(s.group); return s;
}

function buildOrthoGrid(plane){

    for(let i=-E;i<=E;i++){arr(i).push(i,-.02,-E,i,-.02,E,-E,-.02,i,E,-.02,i);}
  }else if(plane==='front'){
    for(let i=-E;i<=E;i++) arr(i).push(i,0,0,i,E,0);
    for(let j=0;j<=E;j++) arr(j).push(-E,j,0,E,j,0);
  }else{
    for(let i=-E;i<=E;i++) arr(i).push(0,0,i,0,E,i);

function applyLights(){
  const R=Math.max(room.w,room.d)*.8+4;
  hemi.intensity=L.fill; hemi.color.set(L.sky); hemi.groundColor.set(L.gnd);

  const kp=dirVec(L.key.az,L.key.el).multiplyScalar(R);
  sun.position.copy(kp); sun.intensity=L.key.i; sun.color.copy(kelvin(L.key.k));
  const rp=dirVec(L.rim.az,L.rim.el).multiplyScalar(R);
  rim.position.copy(rp); rim.intensity=L.rim.i; rim.color.copy(kelvin(L.rim.k));

  const ly=room.h-.3;
  lamp.position.set(L.lamp.x,ly,L.lamp.z); lamp.intensity=world.showRoom?L.lamp.i:0; lamp.color.copy(kelvin(L.lamp.k));
  lamp.distance=Math.max(room.w,room.d)*1.6+room.h;
  bulb.position.copy(lamp.position); bulb.visible=cord.visible=false;
  bulb.material.color.copy(L.lamp.i>.01?kelvin(L.lamp.k):new THREE.Color(.55,.55,.55));
  cord.scale.y=.3; cord.position.set(L.lamp.x,room.h-.15,L.lamp.z);

  renderer.toneMappingExposure=Math.pow(2,L.ev);
  if(sun.castShadow!==L.shadows){
    sun.castShadow=L.shadows;
    scene.traverse(o=>{if(o.material)[].concat(o.material).forEach(m=>{m.needsUpdate=true;});});
  }
  shells.forEach(s=>[s.ceil,s.back,s.front,s.left,s.right].forEach(m=>{m.castShadow=!!L.block;}));

  bgShot.set(L.bg);
  winGlass.material.color.copy(C(L.bg));
  placeMark(markKey,kp); placeMark(markRim,rp);
  updateWorldLighting();
}

function buildHall(){
  hallG.children.slice().forEach(ch=>{hallG.remove(ch);disposeGroup(ch);});
  if(room.kind!=='hall') return;
  const {w,d,h}=room, dh=Math.min(2.05,h-.15);
  const dm=new THREE.MeshStandardMaterial({color:C(0x6b4a32),roughness:.7}), fm=new THREE.MeshStandardMaterial({color:C(0xf2eee6),roughness:.8}),
        km=new THREE.MeshStandardMaterial({color:C(0xcaa84a),metalness:.6,roughness:.3}), rm=new THREE.MeshStandardMaterial({color:C(0x7a2e2e),roughness:.95}),
        lm=new THREE.MeshBasicMaterial({color:C(0xfff1d6),toneMapped:false,fog:false});
  const add=(m,x,y,z,sx,sy,sz,sh)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),m);o.position.set(x,y,z);o.castShadow=!!sh;o.receiveShadow=true;hallG.add(o);return o;};
  const n=Math.max(1,Math.floor((d-2)/3.4)), gap=(d-3)/n;
  for(let i=0;i<n;i++){
    const zl=-d/2+1.5+gap*(i+.5), zr=Math.min(zl+gap*.5,d/2-1.2);
    [[-1,zl,room.open.left],[1,zr,room.open.right]].forEach(([sd,z,open])=>{
      if(open) return;
      const wx=sd*(w/2);
      add(fm,wx-sd*.018,dh/2+.02,z,.04,dh+.06,1.08);
      add(dm,wx-sd*.05,dh/2,z,.04,dh,.9);
      add(km,wx-sd*.078,.98,z+.33,.04,.04,.04);
    });
  }
  if(!room.open.back&&w>=1.4){
    add(fm,0,dh/2+.02,-d/2+.018,1.08,dh+.06,.04);
    add(dm,0,dh/2,-d/2+.05,.9,dh,.04);
    add(km,.33,.98,-d/2+.078,.04,.04,.04);
  }
  add(rm,0,.008,0,Math.max(.6,w*.45),.012,Math.max(1,d-1.2));
  if(!room.open.ceil){
    const nl=Math.max(1,Math.floor(d/3.2));
    for(let i=0;i<nl;i++) add(lm,0,h-.015,-d/2+d*(i+.5)/nl,Math.min(.6,w*.35),.03,.45);
  }
}
function setRoom(){
  const {w,d,h}=room;
  shells.forEach(placeShell);
  applyOpen(); buildHall();
  props.visible=room.props&&world.showRoom;
  door.visible=knob.visible=!room.open.left&&room.kind!=='hall';
  const dh=Math.min(2.05,h-.15);
  const dz=clamp(-d/2+.8,-d/2+.5,d/2-.5);
  door.scale.set(.05,dh,.9); door.position.set(-w/2+.026,dh/2,dz);
  knob.position.set(-w/2+.07,dh*.48,dz+.33);
  const wh=Math.max(.5,Math.min(1.1,h*.4)), ww=Math.min(1.6,w-.8);
  const wy=Math.min(h*.58,h-wh/2-.2);
  winFrame.visible=winGlass.visible=w>=2.3&&!room.open.back&&room.kind!=='hall';
  winFrame.scale.set(ww,wh,.05); winFrame.position.set(0,wy,-d/2+.026);
  winGlass.scale.set(Math.max(.1,ww-.12),Math.max(.1,wh-.12),1); winGlass.position.set(0,wy,-d/2+.0525);

  roomOutline.geometry.dispose();
  const eg=new THREE.EdgesGeometry(new THREE.BoxGeometry(w,h,d)); eg.translate(0,h/2,0); roomOutline.geometry=eg;

  const pts=[];
  for(let x=Math.ceil(-w/2+1e-6);x<=w/2-1e-6;x++) pts.push(x,.003,-d/2,x,.003,d/2);
  for(let z=Math.ceil(-d/2+1e-6);z<=d/2-1e-6;z++) pts.push(-w/2,.003,z,w/2,.003,z);
  grid.geometry.dispose();
  grid.geometry=new THREE.BufferGeometry();
  grid.geometry.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));

  L.lamp.x=clamp(L.lamp.x,-w/2+.2,w/2-.2); L.lamp.z=clamp(L.lamp.z,-d/2+.2,d/2-.2);
  applyLights();
}

function buildChar(c){
  if(c.root){scene.remove(c.root);disposeObj(c.root);}
  const k=c.look, g=.82+.6*k.build, sw=k.sh;
  const tw=.34*g*(.6+.4*sw), td=.2*g, pw=.31*g, pd=.2*g, dz=td/tw;
  const skin=new THREE.MeshStandardMaterial({color:C(k.skin),roughness:.55,metalness:0});
  const cloth=c=>new THREE.MeshStandardMaterial({color:C(c),roughness:.9,metalness:0});
  const top=cloth(k.topColor), bot=cloth(k.bottomColor), shoe=mat(k.shoeColor), hairM=cloth(k.hairColor), hatM=cloth(k.hatColor);
  const white=mat('#f2f2ee'), dark=mat('#16171a'), wood=mat('#8a6a4a'), skinDk=mat(shade(k.skin,.82)), lipM=mat(shade(k.skin,.72));
  const topDk=cloth(shade(k.topColor,.72)), botDk=cloth(shade(k.bottomColor,.7));

  /* torso profile: radius at each height from waist to neck (torso space), oval in depth */
  const prof=[[pw*.5,-.035],[tw*.41,.08],[tw*.44,.2],[tw*.5,.32],[tw*.5,.39],[tw*.47,.445],[tw*.37,.495],[tw*.2,.53],[.05*g,.55]];
  const rAt=y=>{for(let i=1;i<prof.length;i++){if(y<=prof[i][1]){const [r0,y0]=prof[i-1],[r1,y1]=prof[i];return r0+(r1-r0)*clamp((y-y0)/(y1-y0),0,1);}}return prof[prof.length-1][0];};

  const lathe=(sc,m)=>{const o=new THREE.Mesh(new THREE.LatheGeometry(prof.map(([r,y])=>new THREE.Vector2(r*sc,y)),32),m);o.scale.z=dz;return o;};

  hips.add(ell(pw*.5,.07,pd*.5,bot,0,-.11,0));
  if(k.bottom==='skirt') hips.add(limb(.17*g,.27*g,.36,bot,0,-.16,0,.8));
  if(pants||shorts) hips.add(limb(pw*.51,pw*.51,.035,botDk,0,.08,0,pd/pw));        /* belt */

  const torso=new THREE.Group(); torso.position.y=.08; hips.add(torso);
  const J=jacket?1.07:1;
  torso.add(lathe(J,top));
  if(jacket){
    [-1,1].forEach(sd=>{const l=box(.028,.19,.01,topDk,sd*.036,.415,frontZ(.415,.036,J)+.003);l.rotation.z=-sd*.27;l.rotation.x=-.12;torso.add(l);});
    torso.add(box(.012,.3,.012,topDk,0,.17,frontZ(.17,0,J)+.003));
    const hem=new THREE.Mesh(new THREE.CylinderGeometry(rAt(.02)*J+.006,rAt(-.02)*J+.006,.06,32,1,true),topDk); hem.scale.z=dz; torso.add(hem);
  }else if(!sleeveless){
    const col=new THREE.Mesh(new THREE.TorusGeometry(.056*g+.004,.0055,8,28),topDk); col.position.y=.54; col.rotation.x=Math.PI/2; col.scale.y=.95; torso.add(col);
  }
  /* neck */
  torso.add(limb(.052*g,.056*g,.12,skin,0,.565,0,.95));

  /* head: cranium, jaw, ears, nose */

  const chestMark=new THREE.Object3D(); chestMark.position.y=.3; torso.add(chestMark);
  const head=new THREE.Group(); head.position.y=.12; head.scale.setScalar(k.head); neck.add(head);
  head.add(new THREE.Mesh(headGeo(),skin));
  [-1,1].forEach(sd=>head.add(ell(.012,.03,.022,skinDk,sd*.097,.004,-.008)));

    [-1,1].forEach(s=>{const r=new THREE.Mesh(new THREE.TorusGeometry(.027,.004,6,18),dark);r.position.set(.038*s,.024,.106);head.add(r);

    const upM=sleeveless?skin:top;

    const el=new THREE.Group(); el.position.y=-.3; sh.add(el);
    const fa=longSleeve?top:skin;
    el.add(sph(.037*g,fa));
    el.add(limb(.037*g,.027*g,.25,fa,0,-.125,0,.85));
    if(longSleeve) el.add(limb(.03*g,.03*g,.03,jacket?topDk:top,0,-.245,0));
    el.add(ell(.026*g,.07,.042*g,skin,0,-.32,.004));                                /* hand */
    const th=ell(.012,.03,.012,skin,-s*.02,-.29,.03); th.rotation.z=s*.4; el.add(th);
    return {sh,el,s};
  });

  /* legs: thigh, knee, calf, ankle, shoe with a rounded toe */
  const legs=[1,-1].map(s=>{
    const th=new THREE.Group(); th.rotation.order='ZXY'; th.position.set(.085*g*s,-.04,0); hips.add(th);
    const thM=pants||shorts?bot:(k.bottom==='skirt'?skin:skin);
    if(shorts){th.add(limb(.075*g,.064*g,.26,bot,0,-.11,0));th.add(limb(.06*g,.05*g,.2,skin,0,-.34,0));}
    else th.add(limb(.075*g,.052*g,.42,thM,0,-.19,0));
    const kn=new THREE.Group(); kn.position.y=-.4; th.add(kn);
    const lgM=pants?bot:skin;
    kn.add(sph(.044*g,lgM));
    kn.add(ell(.046*g,.11,.05*g,lgM,0,-.13,-.006));                                   /* calf */
    kn.add(limb(.045*g,.033*g,.4,lgM,0,-.22,0));
    if(pants) kn.add(limb(.046*g,.048*g,.05,botDk,0,-.42,0));

    const fm=k.shoes==='bare'?skin:shoe;
    const foot=box(.085*g,.065,.17,fm,0,-.465,.03); kn.add(foot);
    kn.add(ell(.045*g,.035,.07,fm,0,-.465,.11));
    kn.add(ell(.044*g,.04,.045,fm,0,-.46,-.045));

  });

    const pk=limb(tw*.36,tw*.38,.4,hatM,0,.29,-(frontZ(.3)+tw*.36*.55-.01),.55); torso.add(pk);

  }

function placeChar(c){c.root.position.set(c.x,0,c.z);c.root.rotation.y=c.rot*D2R;}
function applyPose(c,p){

  c.hips.position.y=p.hipY;
  c.legs.forEach(l=>{l.th.rotation.x=p.thigh;l.kn.rotation.x=p.knee;});
  c.arms.forEach(a=>{a.sh.rotation.x=p.upper;a.sh.rotation.z=p.splay*a.s;a.el.rotation.x=p.elbow;});
  c.chair.scale.setScalar(Math.max(.001,p.chair)); c.chair.visible=p.chair>.03;
  c.label.position.y=p.labelY;
  c.legs.forEach(l=>{l.th.rotation.z=0;l.th.rotation.y=0;});
  applyAdj(c);
  if(c.pose==='stand'&&c.adj&&Object.keys(c.adj).length) groundFeet(c);
}
function stepPoses(dt){
  const k=1-Math.exp(-dt*9);
  chars.forEach(c=>{
    const t=POSES[c.pose];
    POSE_KEYS.forEach(key=>{const d=t[key]-c.cur[key]; c.cur[key]=Math.abs(d)>1e-4?c.cur[key]+d*k:t[key];});
    applyPose(c,c.cur);
  });
}
function addChar(o={},snap=true){
  if(chars.length>=MAX_CHARS) return null;
  const used=chars.map(c=>c.color);
  const spot=SPOTS[chars.length%SPOTS.length];
  const c={id:uid++,
    name:o.name||DEFAULT_NAMES[chars.length%4],
    color:o.color||PALETTE.find(p=>!used.includes(p))||PALETTE[0],
    x:o.x!==undefined?o.x:spot[0], z:o.z!==undefined?o.z:spot[1],
    rot:o.rot!==undefined?o.rot:0, pose:o.pose||'stand', adj:o.adj?JSON.parse(JSON.stringify(o.adj)):{}};
  c.look=Object.assign({},DEFAULT_LOOK,{topColor:c.color},o.look||{});
  c.x=clamp(c.x,-WORLD_HALF,WORLD_HALF); c.z=clamp(c.z,-WORLD_HALF,WORLD_HALF);

/* ---------- road junctions: where two roads meet or cross, they join ---------- */
function roadJunctions(it,L){
  const out=[], ax=it.x, az=it.z, ux=(it.x2-ax)/L, uz=(it.z2-az)/L, nx=uz, nz=-ux;
  world.items.forEach(o=>{
    if(o===it||o.id===it.id||o.type!=='road') return;
    const Lb=Math.hypot(o.x2-o.x,o.z2-o.z); if(Lb<.5) return;
    const vx=(o.x2-o.x)/Lb, vz=(o.z2-o.z)/Lb, cr=ux*vz-uz*vx;
    if(Math.abs(cr)<.25) return;                       /* nearly parallel: no junction */
    const dx=o.x-ax, dz=o.z-az, sA=(dx*vz-dz*vx)/cr, sB=(dx*uz-dz*ux)/cr;
    const ow=o.w/2+(o.walk?2.2:0), mw=it.w/2+(it.walk?2.2:0);
    if(sA<-ow-.3||sA>L+ow+.3||sB<-mw-.3||sB>Lb+mw+.3) return;
    const jx=ax+ux*sA, jz=az+uz*sA, occ={'-1':false,'1':false};
    [[o.x,o.z],[o.x2,o.z2]].forEach(([px,pz])=>{const lat=(px-jx)*nx+(pz-jz)*nz;if(Math.abs(lat)>.5)occ[lat>0?'1':'-1']=true;});
    out.push({s:sA,sin:Math.abs(cr),bw:o.w,bwalk:o.walk?2.2:0,occ,end:sA>L-.6,start:sA<.6});
  });
  return out;
}

}

function nearestOnSeg(p,sg){

function rectPts(f){

/* everything an item can stick to: points, line segments (kind 'c' = a road's centre line), and angles */
function snapTargets(exceptId){
  const T={pts:[],segs:[],angles:[]};
  const addRect=f=>{
    const R=rectPts(f); T.pts.push(R.center,...R.corners,...R.mids);
    for(let i=0;i<4;i++){const a=R.corners[i],b=R.corners[(i+1)%4];T.segs.push([a[0],a[1],b[0],b[1],'e']);}

    if(it.id===exceptId) return;
    if(CATALOG[it.type].line){
      const dx=it.x2-it.x, dz=it.z2-it.z, L=Math.hypot(dx,dz); if(L<.01) return;
      const nx=dz/L, nz=-dx/L, road=it.type==='road';
      T.pts.push([it.x,it.z],[it.x2,it.z2],[(it.x+it.x2)/2,(it.z+it.z2)/2]);
      const offs=[[0,road?'c':'e']];

    });

let padA=false;
/* walk with W A S D or the arrow keys, E/Q (or Space/C) to rise and sink, Shift to hurry */
const KEYMAP={KeyW:'fwd+',KeyS:'fwd-',KeyA:'str-',KeyD:'str+',ArrowUp:'fwd+',ArrowDown:'fwd-',ArrowLeft:'str-',ArrowRight:'str+',
  KeyE:'up',Space:'up',KeyQ:'dn',KeyC:'dn',ShiftLeft:'boost',ShiftRight:'boost'};
const keys=new Set();
/* the on-screen pad: hold a button to keep moving */
document.querySelectorAll('.mpad button').forEach(b=>{
  const k=b.dataset.k;
  const on=e=>{keys.add(k);b.classList.add('held');try{b.setPointerCapture(e.pointerId);}catch(err){}e.stopPropagation();e.preventDefault();};
  const off=()=>{keys.delete(k);b.classList.remove('held');};

});

  const k=KEYMAP[e.code]; if(!k) return; keys.add(k); e.preventDefault();

let padBlocked=false;
function pollPad(){
  const out={Lx:0,Ly:0,Rx:0,Ry:0,tilt:0};
  if(padBlocked) return out;
  let pads=[];
  /* some viewers forbid gamepad access; if so, turn controllers off instead of crashing */
  try{pads=navigator.getGamepads?navigator.getGamepads():[];}catch(err){padBlocked=true;return out;}
  for(const p of pads){
    if(!p) continue;
    const dz=v=>Math.abs(v)<.1?0:v, b=p.buttons;
    out.Lx=dz(p.axes[0]||0); out.Ly=-dz(p.axes[1]||0); out.Rx=dz(p.axes[2]||0); out.Ry=-dz(p.axes[3]||0);
    out.tilt=0; out.lift=((b[5]&&b[5].pressed)?1:0)-((b[4]&&b[4].pressed)?1:0);
    const a=!!(b[0]&&b[0].pressed); if(a&&!padA) addShot(); padA=a;

}
/* walking: left stick or keys move, right stick looks (game-controller style) */

    thr:clamp((gp.lift||0)+kax('up','dn'),-1,1), yaw:clamp(gp.Rx+kax('yaw+','yaw-')*.6,-1,1),
    fwd:clamp(gp.Ly+kax('fwd+','fwd-'),-1,1), str:clamp(gp.Lx+kax('str+','str-'),-1,1),
    tilt:clamp(gp.Ry,-1,1)

}

function flight(dt){
  const inp=readInput(), v=fly.vel, k=1-Math.exp(-dt*(30-27*fly.smooth));
  const spd=fly.speed*(keys.has('boost')?3:1);
  v.f+=(inp.fwd*spd-v.f)*k; v.r+=(inp.str*spd-v.r)*k; v.u+=(inp.thr*spd*.6-v.u)*k;

  cam.y+=((fly.pointing?Math.sin(p)*v.f:0)+v.u)*dt;

  cam.yaw=wrap180(cam.yaw-v.yw*dt); cam.pitch=clamp(cam.pitch+v.tl*dt,-89,89);

  if(Math.hypot(d.it.x2-d.it.x,d.it.z2-d.it.z)<1) return;
  const it=newItem(d.it.type,d.it.x,d.it.z,d.it.x2,d.it.z2);
  world.items.push(it); mountItem(it); selectItem(world.items.length-1); renderItemList();
}
function startOrtho(x,y){
  const w=stage.clientWidth,h=stage.clientHeight;
  const scr=v=>{const q=v.clone().project(orthoCam);return {x:(q.x+1)/2*w,y:(1-q.y)/2*h};};
  const near=(q,r)=>Math.hypot(q.x-x,q.y-y)<r;
  if(view!=='front'&&near(scr(hanG.position),30)){drag={type:'handle'};mode='drag';return;}
  if(near(scr(dotG.position),32)){
    const p=planePoint(x,y), [ca,cb]=toPlane(cam.x,cam.y,cam.z);
    drag={type:'cam2',oa:ca-p[0],ob:cb-p[1]}; mode='drag'; return;
  }
  if(view==='front'&&hArr.visible&&near(scr(hArr.position),30)){
    const it=world.items[selItem]; if(it){drag={type:'height'};mode='drag';return;}
  }
  if(view==='top'){
    for(let i=0;i<4;i++) if(sizeAr[i].visible&&near(scr(sizeAr[i].position),30)){
      const it=world.items[selItem]; if(it){drag={type:'resize',side:i,w0:it.w,d0:it.d,x0:it.x,z0:it.z};mode='drag';return;}
    }
    if(rotG.visible&&near(scr(rotG.position),30)){drag={type:'rot'};mode='drag';return;}
    for(let i=0;i<2;i++) if(endG[i].visible&&near(scr(endG[i].position),30)){drag={type:'end',i};mode='drag';return;}
    if(placing&&placing[0]!=='@'){startPlace(x,y);return;}
  }
  const hit=pick(x,y);
  if(hit&&hit.type==='char'){
    select(hit.idx); const c=chars[hit.idx]; armLongPress(hit.idx,x,y);
    if(view==='top'){const p=groundXZ(x,y);drag={type:'char',idx:hit.idx,dx:c.x-p[0],dz:c.z-p[1]};mode='drag';return;}
  }
  if(placing&&placing[0]==='@'&&view==='top'){startCharPlace(x,y);return;}
  if(hit&&hit.type==='item'){
    if(!hit.door&&focus==='group'&&world.items[hit.idx].grp===selGroup&&view==='top'){beginGroupDrag(x,y,hit.idx);return;}
    if(!hit.door&&hit.idx===selItem&&focus==='item'&&view==='top'){beginItemDrag(hit.idx,x,y);return;}
    tap={kind:'item',idx:hit.idx,x,y,moved:false,door:hit.door}; mode='opan'; return;
  }
  tap={kind:'clear',x,y,moved:false}; mode='opan';
}
function beginItemDrag(idx,x,y){
  const it=world.items[idx], p=groundXZ(x,y); if(!p){mode='opan';return;}

function startSingle(x,y,e){

  if(appMode==='pose'){posePointerDown(x,y,e);return;}
  if(view==='camera'){mode=(e.button===2||e.shiftKey)?'slide':'look';return;}
  if(isOrtho(view)){startOrtho(x,y);return;}
  const hit=pick(x,y), p=floorPoint(x,y);
  if(hit&&hit.type==='char'&&p){
    select(hit.idx); const c=chars[hit.idx]; armLongPress(hit.idx,x,y);
    drag={type:'char',idx:hit.idx,dx:c.x-p.x,dz:c.z-p.z}; mode='drag';
  }else if(hit&&hit.type==='item'){
    if(!hit.door&&focus==='group'&&world.items[hit.idx].grp===selGroup&&p) beginGroupDrag(x,y,hit.idx);
    else if(!hit.door&&hit.idx===selItem&&focus==='item'&&p) beginItemDrag(hit.idx,x,y);
    else{tap={kind:'item',idx:hit.idx,x,y,moved:false,door:hit.door};mode='orbit';}

    drag={type:'cam',dx:cam.x-p.x,dz:cam.z-p.z}; mode='drag';

    if(mode==='orbit') tap={kind:'clear',x,y,moved:false};
  }
}
function doTap(){
  if(!tap||tap.moved) return;
  if(tap.kind==='part'){selectPart(tap.idx);return;}
  if(tap.kind==='item'){const di=world.items[tap.idx];if(tap.door&&di&&di.doorOpen!==undefined)toggleDoor(di);if(di&&di.grp&&grpOf(di.grp)&&!(focus==='group'&&selGroup===di.grp))selectGroup(di.grp);else selectItem(tap.idx);if(appMode==='build')gotoTab('world');}
  else if(tap.kind==='clear'){if(selItem>=0||focus==='group')selectItem(-1);}
  else if(tap.kind==='place'&&placing){
    const p=groundXZ(tap.x,tap.y); if(!p) return;
    const it=newItem(placing,snapV(p[0]),snapV(p[1]));
    if(world.magnet) magnetPlace(it,p[0],p[1]);

  }
}

    if(p&&p.catch) p.catch(()=>{lockBlocked=true;toast('Mouse capture is blocked here, so drag to look instead');});
  }catch(err){lockBlocked=true;toast('Mouse capture is blocked here, so drag to look instead');}
}

function dragMove(x,y){
  const lim=v=>clamp(v,-CAM_LIMIT,CAM_LIMIT);
  if(drag.type==='part'||drag.type==='mres'){modelDragMove(x,y);return;}
  if(drag.type==='joint'){poseDragMove(x,y);return;}
  if(drag.type==='char'){
    const c=chars[drag.idx], p=groundXZ(x,y); if(!c||!p) return;
    c.x=clamp(p[0]+drag.dx,-WORLD_HALF,WORLD_HALF); c.z=clamp(p[1]+drag.dz,-WORLD_HALF,WORLD_HALF); placeChar(c);
  }else if(drag.type==='group'){
    const p=groundXZ(x,y); if(!p) return;

      if(best){gx=nx+best.dx;gz=nz+best.dz;snapInfo.on=true;snapInfo.x=best.x;snapInfo.z=best.z;}
    }
    it.x=clamp(gx,-WORLD_HALF,WORLD_HALF); it.z=clamp(gz,-WORLD_HALF,WORLD_HALF);
    if(line){it.x2=it.x+drag.lx;it.z2=it.z+drag.lz;}
    updateItemTransform(it);
  }else if(drag.type==='cam'){
    const p=groundXZ(x,y); if(!p) return;
    cam.x=lim(p[0]+drag.dx); cam.z=lim(p[1]+drag.dz); updateCamPose();
  }else if(drag.type==='cam2'){
    const p=planePoint(x,y), a=p[0]+drag.oa, b=p[1]+drag.ob;
    if(view==='top'){cam.x=lim(a);cam.z=lim(b);}
    else if(view==='front'){cam.x=lim(a);cam.y=clamp(b,.05,CAM_MAX_H);}
    else{cam.z=lim(a);cam.y=clamp(b,.05,CAM_MAX_H);}
    updateCamPose();

    const p=planePoint(x,y);
    if(view==='top'){

    }
    updateCamPose();
  }else if(drag.type==='rot'){
    const it=focus==='item'?world.items[selItem]:null, ch=focus==='char'?chars[sel]:null;
    const f=it?fpOf(it):ch?{cx:ch.x,cz:ch.z}:null; if(!f) return;

    if(sr!==null) a=sr; else if(world.snap) a=Math.round(a/15)*15;

  }else if(drag.type==='resize'){
    const it=world.items[selItem], U=it&&sizableUI(it); if(!U) return;
    const p=planePoint(x,y), th=it.rot*D2R, c=Math.cos(th), sn=Math.sin(th);
    const dx=p[0]-drag.x0, dz=p[1]-drag.z0, lx=dx*c-dz*sn, lz=dx*sn+dz*c;
    const axX=drag.side<2, sg=drag.side%2===0?1:-1, l=axX?lx:lz, s0=axX?drag.w0:drag.d0, ui=axX?U.w:U.d;

    rebuildItem(it);
    $('#vlabel').textContent='W '+it.w.toFixed(1)+' m  x  D '+it.d.toFixed(1)+' m'+(it.h!==undefined?'  x  H '+it.h.toFixed(1)+' m':'');
  }else if(drag.type==='height'){
    const it=world.items[selItem], U=it&&sizableUI(it); if(!U||!U.h) return;
    const p=planePoint(x,y);
    it.h=clamp(Math.round(p[1]*2)/2,U.h.min,U.h.max); rebuildItem(it);

    if(Math.hypot(it.x2-it.x,it.z2-it.z)<.5) return;
    rebuildItem(it);
  }
  refreshUI();
}
canvas.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId); if(!p) return;
  const q=lp(e), x=q.x, y=q.y, dx=x-p.x, dy=y-p.y; p.x=x; p.y=y;
  if(tap&&!tap.moved&&Math.hypot(x-tap.x,y-tap.y)>8) tap.moved=true;
  if(lpAt&&Math.hypot(x-lpAt.x,y-lpAt.y)>8) cancelLongPress();
  if(ptrs.size===1){
    if(mode==='orbit'){orbit.az-=dx*.007;orbit.pol=clamp(orbit.pol-dy*.007,.12,1.52);}
    else if(mode==='pan') panTarget(dx,dy);
    else if(mode==='mpan'){const s=mOv[mView], wpp=s.span/stage.clientHeight; s.a-=dx*wpp; s.b+=(mView==='top'?-dy:dy)*wpp;}
    else if(mode==='opan'){
      const s=ov[view], wpp=s.span/stage.clientHeight;
      s.a-=dx*wpp; s.b+=(view==='top'?-dy:dy)*wpp;
    }
    else if(mode==='look') look(dx,dy);
    else if(mode==='slide') slideCam(dx,dy);
    else if(mode==='draw') drawMove(x,y);
    else if(mode==='cplace') charPlaceMove(x,y);
    else if(mode==='drag'&&drag) dragMove(x,y);
  }else if(ptrs.size===2&&pinch){
    const [a,b]=[...ptrs.values()], d=Math.hypot(a.x-b.x,a.y-b.y), mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    if(appMode==='model'&&mView!=='3d'){
      const s=mOv[mView], wpp=s.span/stage.clientHeight;
      s.span=clamp(s.span*(pinch.d/Math.max(d,1)),.4,120);
      s.a-=(mx-pinch.mx)*wpp; s.b+=(mView==='top'?-(my-pinch.my):(my-pinch.my))*wpp;
    }else if(view==='director'){

    }else if(isOrtho(view)){

  }
});
function endPtr(e){
  ptrs.delete(e.pointerId); cancelLongPress();
  if(ptrs.size===0){
    snapInfo.on=false;
    if(drag&&(drag.type==='resize'||drag.type==='height')) layoutOverlays();
    if(drag&&(drag.type==='part'||drag.type==='mres')) modelChanged();
    if(mode==='draw'&&draft) commitDraft(); else if(mode==='cplace') finishCharPlace(); else doTap();
    mode=null; drag=null; pinch=null; tap=null;
  }else if(ptrs.size===1){
    cancelDraft(); tap=null; mode=appMode==='model'&&mView!=='3d'?'mpan':view==='camera'?'look':isOrtho(view)?'opan':'orbit'; drag=null; pinch=null;
  }

const syncs=[], dynSyncs=[];
function refreshUI(){syncs.forEach(f=>f());dynSyncs.forEach(f=>f());}
function addSlider(parent,o,bucket=syncs){
  const row=document.createElement('label'); row.className='row';
  row.innerHTML='<span class="lbl">'+o.label+'</span><input type="range" step="'+o.step+'"><span class="val"><input type="number" class="num" inputmode="decimal" step="any"><span class="unit"></span></span>';
  const inp=$('input[type=range]',row), num=$('.num',row), unit=$('.unit',row);
  const dec=String(o.step).includes('.')?String(o.step).split('.')[1].length:0;
  const show=v=>Number((+v).toFixed(dec));
  num.setAttribute('aria-label',o.label);
  inp.addEventListener('input',()=>{o.set(parseFloat(inp.value));refreshUI();});
  /* typed numbers: applied on Enter or when the box loses focus, kept inside the slider's range */
  const commit=()=>{
    const v=parseFloat(num.value), [mn,mx]=o.range?o.range():[o.min,o.max];
    if(isFinite(v)){o.set(clamp(v,mn,mx));refreshUI();}
    num.value=show(o.get());
  };
  num.addEventListener('change',commit);
  num.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();num.blur();}
    else if(e.key==='Escape'){num.value=show(o.get());num.blur();}
    e.stopPropagation();
  });
  num.addEventListener('click',e=>e.preventDefault());
  num.addEventListener('focus',()=>num.select());
  bucket.push(()=>{
    const [mn,mx]=o.range?o.range():[o.min,o.max];
    inp.min=mn; inp.max=mx; const v=o.get(); inp.value=v;
    if(document.activeElement!==num) num.value=show(v);
    /* unit beside the box: "1.5 m" -> "m"; labels that are not the number itself (Slim, 24°) are shown whole */
    const f=o.fmt?String(o.fmt(v)):'', m=f.match(/^\s*(-?[\d.]+)\s*(.*)$/);
    unit.textContent=m&&Math.abs(parseFloat(m[1])-v)<1e-6+Math.pow(10,-dec)?m[2]:f;
    unit.title=f;
  });
  parent.appendChild(row); return row;
}
function addSeg(parent,opts,get,set,bucket=syncs){

function loadPicture(file,maxDim){
  return new Promise((res,rej)=>{
    if(!file||!/^image\//.test(file.type)) return rej(new Error('not an image'));
    const url=URL.createObjectURL(file), im=new Image();
    im.onload=()=>{
      const k=Math.min(1,maxDim/Math.max(im.naturalWidth,im.naturalHeight)), w=Math.round(im.naturalWidth*k), h=Math.round(im.naturalHeight*k);
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(im,0,0,w,h);
      URL.revokeObjectURL(url);
      res({dataURL:cv.toDataURL('image/jpeg',.82),w,h});
    };
    im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('unreadable'));};
    im.src=url;
  });
}

    c.z=clamp(cam.z+F[1]*gd*Math.cos(a)+Rt[1]*gd*Math.sin(a),-WORLD_HALF,WORLD_HALF);
    const tc=[cam.x-c.x,cam.z-c.z], L=Math.hypot(tc[0],tc[1])||1; tc[0]/=L; tc[1]/=L;
    const f=String(sj.facing||'camera').toLowerCase();

    c.rot=Math.atan2(dir[0],dir[1])*R2D;
    if(POSES[sj.pose]) c.pose=sj.pose;
    placeChar(c);
  });
  /* characters the picture doesn't need step out of shot, behind the camera */
  chars.slice(subs.length).forEach((c,k)=>{c.x=clamp(cam.x-F[0]*2.5+Rt[0]*(k-1)*1.2,-WORLD_HALF,WORLD_HALF);c.z=clamp(cam.z-F[1]*2.5+Rt[1]*(k-1)*1.2,-WORLD_HALF,WORLD_HALF);placeChar(c);});

function buildSceneObjects(list){
  const y=cam.yaw*D2R, F=[-Math.sin(y),-Math.cos(y)], Rt=[Math.cos(y),-Math.sin(y)];
  const W=p=>Array.isArray(p)&&p.length>=2&&isFinite(+p[0])&&isFinite(+p[1])?[clamp(cam.x+Rt[0]*p[0]+F[0]*p[1],-WORLD_HALF,WORLD_HALF),clamp(cam.z+Rt[1]*p[0]+F[1]*p[1],-WORLD_HALF,WORLD_HALF)]:null;
  const allowed=new Set([].concat(...Object.values(SCENE_TYPES)));
  const made=[];
  (Array.isArray(list)?list:[]).slice(0,60).forEach(o=>{
    if(!o||!allowed.has(o.type)||!CATALOG[o.type]) return;
    const t=CATALOG[o.type], rng=k=>{const u=(t.ui||[]).find(u=>u.k===k&&u.min!==undefined);return u?[u.min,u.max]:[.1,200];};
    const num=(k,v)=>{v=Number(v);if(!isFinite(v))return;const [a,b]=rng(k);return clamp(v,a,b);};
    let it;
    if(t.line){
      const a=W(o.from), b=W(o.to); if(!a||!b||Math.hypot(b[0]-a[0],b[1]-a[1])<.5) return;
      it=newItem(o.type,a[0],a[1],b[0],b[1]);
      if(num('w',o.w)!==undefined&&it.w!==undefined) it.w=num('w',o.w);
      if(num('h',o.h)!==undefined&&it.h!==undefined) it.h=num('h',o.h);
      if(typeof o.sidewalks==='boolean'&&it.walk!==undefined) it.walk=o.sidewalks;
    }else{
      const a=W(o.at); if(!a) return;
      it=newItem(o.type,a[0],a[1]);
      const tc=[cam.x-a[0],cam.z-a[1]], L=Math.hypot(tc[0],tc[1])||1, tr=(Number(o.turn_deg)||0)*D2R;
      const dir=[Math.cos(tr)*tc[0]/L+Math.sin(tr)*Rt[0],Math.cos(tr)*tc[1]/L+Math.sin(tr)*Rt[1]];
      it.rot=Math.round(Math.atan2(dir[0],dir[1])*R2D);
      ['w','d','h'].forEach(k=>{const v=num(k,o[k]);if(v!==undefined&&it[k]!==undefined)it[k]=v;});
      if(it.s!==undefined){const v=Number(o.size);if(isFinite(v))it.s=clamp(v,.5,3);}
      if(it.roof!==undefined&&(o.roof==='flat'||o.roof==='gable')) it.roof=o.roof;
    }
    if(it.color!==undefined&&hexOk(o.color)) it.color=o.color.toLowerCase();
    world.items.push(it); mountItem(it); made.push(it);
  });
  return made;
}
async function buildSceneFromPicture(file,fresh,say){
  const sample=await getSampler();
  if(!sample){say('This needs the Claude version of the app.');return;}
  const lim=await sample.limits().catch(()=>null);
  if(!lim||!lim.images){say('Picture reading is not available here.');return;}
  let pic; try{pic=await loadPicture(file,1280);}catch(err){say('That file could not be opened as a picture.');return;}
  Object.assign(still,{src:pic.dataURL,w:pic.w,h:pic.h,show:true,opacity:.35}); applyStill();
  say('Studying the picture…');
  try{
    const r=await sample.json(SCENE_PROMPT,{images:[dataURLBlob(pic.dataURL)],onText:({text})=>say('Laying out the set… '+text.length+' characters so far')});
    if(!r||typeof r!=='object') throw {code:'invalid_json'};
    if(fresh){world.items.slice().forEach(unmountItem);world.items=[];world.groups=[];selItem=-1;selGroup=null;if(focus!=='char')focus='char';}
    const made=buildSceneObjects(r.objects);
    const shot=applyShotGuess(r);
    let g=null; if(made.length){g=makeGroup(made,(typeof r.setting==='string'&&r.setting.trim()?r.setting.trim():'Scene from picture').slice(0,30));}
    renderItemEditor(); renderItemList(); refreshUI(); setView('camera'); later(30); autosave();
    say('Built '+made.length+' object'+(made.length===1?'':'s')+(g?' in the group "'+g.name+'"':'')+', '+shot.people+' '+(shot.people===1?'person':'people')+', '+shot.msg+'. The picture is shown see-through over the camera frame to compare (Camera tab > Match a film still).');
  }catch(e){
    const c=e&&e.code;
    say(c==='rate_limited'?'Too many requests right now. Try again in a minute.':c==='invalid_json'?'The answer could not be read. Try again.':
      c==='image_rejected'?'That picture could not be used. Try a JPEG or PNG.':(c==='not_granted'||c==='sampling_disabled'||c==='images_unavailable')?'Picture reading is not available here.':'Something went wrong. Try again.');
  }
}

async function matchStill(say){
  if(!still.src){say('Choose a still first.');return;}
  const sample=await getSampler();
  if(!sample){say('Matching needs the Claude version of this app. You can still line the shot up by hand with the see-through still.');return;}
  const lim=await sample.limits().catch(()=>null);
  if(!lim||!lim.images){say('Picture reading is not available here.');return;}
  say('Studying the still…');
  try{
    const r=await sample.json(STILL_PROMPT,{images:[dataURLBlob(still.src)],onText:()=>say('Working out the lens and camera position…')});
    if(!r||typeof r!=='object') throw {code:'invalid_json'};
    const res=applyShotGuess(r);
    refreshUI(); setView('camera'); later(30);
    say('Matched: '+res.msg+'. '+(res.people?res.people+' '+(res.people>1?'people':'person')+' placed. ':'')+(typeof r.notes==='string'?r.notes.slice(0,160):''));
  }catch(e){
    const c=e&&e.code;
    say(c==='rate_limited'?'Too many requests right now. Try again in a minute.':c==='invalid_json'?'The answer could not be read. Try again.':
      c==='image_rejected'?'That picture could not be used. Try a JPEG or PNG.':(c==='not_granted'||c==='sampling_disabled'||c==='images_unavailable')?'Picture reading is not available here.':'Something went wrong. Try again.');
  }
}

const pickSet=new Set();
const grpOf=id=>world.groups.find(g=>g.id===id);

function pruneGroups(){
  world.groups=world.groups.filter(g=>world.items.some(it=>it.grp===g.id));
  world.items.forEach(it=>{if(it.grp&&!grpOf(it.grp))delete it.grp;});

function newGroupId(){return 1+world.groups.reduce((m,g)=>Math.max(m,g.id),0);}
function makeGroup(items,name){
  const g={id:newGroupId(),name:name||('Group '+(world.groups.length+1)),open:true};
  world.groups.push(g); items.forEach(it=>{it.grp=g.id;}); pruneGroups(); return g;
}
function selectGroup(id){selGroup=id;selItem=-1;focus=id?'group':'char';renderItemEditor();renderItemList();refreshUI();}
function groupBox(id){
  let x0=Infinity,z0=Infinity,x1=-Infinity,z1=-Infinity;
  grpItems(id).forEach(it=>{const R=rectPts(fpOf(it));R.corners.forEach(([x,z])=>{x0=Math.min(x0,x);x1=Math.max(x1,x);z0=Math.min(z0,z);z1=Math.max(z1,z);});});
  return {x0,z0,x1,z1,cx:(x0+x1)/2,cz:(z0+z1)/2};
}
function moveGroup(id,dx,dz){
  grpItems(id).forEach(it=>{it.x+=dx;it.z+=dz;if(CATALOG[it.type].line){it.x2+=dx;it.z2+=dz;}updateItemTransform(it);});
}
function turnGroup(id,deg){
  const b=groupBox(id), a=-deg*D2R, c=Math.cos(a), s=Math.sin(a);
  const rot=(x,z)=>{const dx=x-b.cx,dz=z-b.cz;return [b.cx+dx*c-dz*s,b.cz+dx*s+dz*c];};
  grpItems(id).forEach(it=>{
    [it.x,it.z]=rot(it.x,it.z);
    if(CATALOG[it.type].line)[it.x2,it.z2]=rot(it.x2,it.z2); else it.rot=wrap180((it.rot||0)+deg);
    updateItemTransform(it);
  });
}
function deleteGroup(id){
  grpItems(id).forEach(it=>{unmountItem(it);world.items.splice(world.items.indexOf(it),1);});
  world.groups=world.groups.filter(g=>g.id!==id); selectGroup(null);

function shapeGeo(k){
  if(k==='cylinder') return new THREE.CylinderGeometry(.5,.5,1,20);
  if(k==='sphere') return new THREE.SphereGeometry(.5,20,14);
  if(k==='cone') return new THREE.ConeGeometry(.5,1,20);
  if(k==='pyramid'){const g=new THREE.ConeGeometry(Math.SQRT1_2,1,4);g.rotateY(Math.PI/4);return g;}
  if(k==='wedge'){
    const sh=new THREE.Shape(); sh.moveTo(-.5,-.5); sh.lineTo(.5,-.5); sh.lineTo(0,.5); sh.lineTo(-.5,-.5);
    const g=new THREE.ExtrudeGeometry(sh,{depth:1,bevelEnabled:false}); g.translate(0,0,-.5); g.computeVertexNormals(); return g;
  }
  return new THREE.BoxGeometry(1,1,1);
}
function partMesh(p){
  const m=new THREE.Mesh(shapeGeo(p.shape),bm(p.color||'#cccccc',.8));
  m.scale.set(Math.max(.01,p.w),Math.max(.01,p.h),Math.max(.01,p.d));
  m.rotation.set((p.rx||0)*D2R,(p.ry||0)*D2R,(p.rz||0)*D2R,'YXZ');
  m.position.set(p.x||0,(p.y||0)+p.h/2,p.z||0);
  m.castShadow=true; m.receiveShadow=true;
  return m;
}
/* the house generator: walls, floors, windows, door, roof and extras from a few settings */
function houseParts(H){
  const P=[], add=(shape,x,y,z,w,h,d,color)=>P.push({shape,x,y,z,w,h,d,ry:0,color,gen:true});
  const wallH=H.floors*H.floorH, ov=.4, glass='#2d3b4a';
  add('box',0,0,0,H.w,wallH,H.d,H.wall);
  for(let f=1;f<H.floors;f++) add('box',0,f*H.floorH-.08,0,H.w+.12,.16,H.d+.12,H.trim);
  const rh=H.roof==='flat'?.3:(H.w/2+ov)*H.pitch;
  if(H.roof==='gable') add('wedge',0,wallH,0,H.w+ov*2,rh,H.d+ov*2,H.roofColor);
  else if(H.roof==='hip') add('pyramid',0,wallH,0,H.w+ov*2,rh,H.d+ov*2,H.roofColor);
  else add('box',0,wallH,0,H.w+.3,rh,H.d+.3,H.roofColor);
  const spread=(n,len,skip)=>{const out=[];for(let i=0;i<n;i++){const x=-len/2+len*(i+.5)/n;if(!skip||Math.abs(x)>1.1)out.push(x);}return out;};
  const nSide=Math.max(1,Math.round(H.d/3.6));
  for(let f=0;f<H.floors;f++){
    const y=f*H.floorH+.9;
    if(H.win>0){
      [1,-1].forEach(sd=>spread(H.win,H.w,f===0&&sd===1&&H.door).forEach(x=>{
        add('box',x,y-.08,sd*(H.d/2+.02),1.06,1.36,.06,H.trim); add('box',x,y,sd*(H.d/2+.05),.9,1.2,.06,glass);
      }));
      [1,-1].forEach(sd=>spread(nSide,H.d).forEach(z=>{
        add('box',sd*(H.w/2+.02),y-.08,z,.06,1.36,1.06,H.trim); add('box',sd*(H.w/2+.05),y,z,.06,1.2,.9,glass);
      }));
    }
  }
  if(H.door){add('box',0,0,H.d/2+.02,1.25,2.3,.06,H.trim);add('box',0,0,H.d/2+.05,1.0,2.15,.06,'#6b4a33');}
  if(H.porch){
    const pw=Math.min(H.w-.4,Math.max(3,H.w*.55));
    add('box',0,0,H.d/2+1,pw,.2,2,'#9aa0a6');
    [-1,1].forEach(sd=>add('cylinder',sd*(pw/2-.2),.2,H.d/2+1.8,.18,H.floorH-.35,.18,H.trim));
    add('box',0,H.floorH-.15,H.d/2+1,pw+.2,.15,2.2,H.roofColor);
  }
  if(H.chimney) add('box',H.w/4,wallH,-H.d/5,.8,rh+(H.roof==='flat'?1.2:.9),.8,'#a0523d');
  if(H.garage){
    const gx=H.w/2+2.2;
    add('box',gx,0,H.d/2-3.2,4.4,3,6.4,H.wall); add('box',gx,3,H.d/2-3.2,4.7,.25,6.7,H.roofColor);
    add('box',gx,0,H.d/2+.03,3.2,2.4,.06,H.trim);
  }
  return P;
}
const modelParts=m=>(m.house?houseParts(m.house):[]).concat(m.parts);
function modelFootprint(m){

    const r=(p.ry||0)*D2R, c=Math.abs(Math.cos(r)), s=Math.abs(Math.sin(r));

}
function modelHeight(m){let h=.1;modelParts(m).forEach(p=>{h=Math.max(h,(p.y||0)+p.h);});return h;}
/* placed copies have their own width, depth and height, so they stretch like buildings */
function registerModel(m){

const num=(v,a,b,d)=>{v=Number(v);return isFinite(v)?clamp(v,a,b):d;};
const hexOk=c=>typeof c==='string'&&/^#[0-9a-f]{6}$/i.test(c);
function sanitizeParts(arr){
  return (Array.isArray(arr)?arr:[]).slice(0,150).filter(p=>p&&typeof p==='object').map(p=>({
    shape:SHAPE_KEYS.includes(p.shape)?p.shape:'box',
    x:num(p.x,-200,200,0),y:num(p.y,-50,200,0),z:num(p.z,-200,200,0),
    w:num(p.w,.02,200,1),h:num(p.h,.02,200,1),d:num(p.d,.02,200,1),
    rx:num(p.rx,-180,180,0),ry:num(p.ry,-180,180,0),rz:num(p.rz,-180,180,0),

function sanitizeHouse(h){

  if(!h||typeof h!=='object') return H;
  H.w=num(h.w,3,40,H.w); H.d=num(h.d,3,40,H.d); H.floors=Math.round(num(h.floors,1,8,H.floors)); H.floorH=num(h.floorH,2.2,5,H.floorH);

function applyAdj(c){

const bp=new Map(); let bmode=null, bdrag=null, bpinch=null;

/* ---------- Pictures on shots: import any image as a shot, or onto one ---------- */
async function pictureToShot(file){
  const pic=await loadPicture(file,1800), asp=nearestAspect(pic.w/pic.h), r=ASPECTS[asp];
  const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=pic.dataURL;});
  let sw=im.naturalWidth, sh=im.naturalHeight; if(sw/sh>r) sw=sh*r; else sh=sw/r;      /* trim to the nearest frame shape */
  const cv=document.createElement('canvas'); cv.width=900; cv.height=Math.round(900/r);
  cv.getContext('2d').drawImage(im,(im.naturalWidth-sw)/2,(im.naturalHeight-sh)/2,sw,sh,0,0,cv.width,cv.height);
  return {thumb:cv.toDataURL('image/jpeg',.88),aspect:asp};
}
async function addPictures(files,target){
  const list=[...(files||[])].filter(f=>/^image\//.test(f.type));
  if(!list.length){toast('Choose a picture file');return;}
  try{
    if(target){
      const p=await pictureToShot(list[0]); target.thumb=p.thumb; target.aspect=p.aspect; target.pic=true;
      rebuildShown(target); renderShots(); toast('Picture added to shot '+(frames.indexOf(target)+1)); return;
    }
    toast(list.length>1?'Adding '+list.length+' pictures…':'Adding picture…');
    for(const file of list){
      const p=await pictureToShot(file), last=frames[frames.length-1];
      const f={thumb:p.thumb,note:'',state:snapshot(),lens:cam.lens,aspect:p.aspect,pic:true};
      if(last&&typeof last.nx==='number'){f.nx=last.nx+BW+GAPX;f.ny=last.ny;}
      frames.push(f); bv.sel=f;
    }
    renderShots(); if(shotMode==='nodes') fitBoard(); toast(list.length>1?list.length+' pictures added as shots':'Picture added as shot '+frames.length);
  }catch(err){toast('That file could not be opened as a picture');}
}

const miniCv=$('#miniCv'), miniCtx=miniCv.getContext('2d'), miniImgs=new Map();

function drawMini(){
  if(!miniReady) return;

    g.fillText('No shots yet',cw/2,ch/2+4); return;
  }

  frames.forEach(f=>{x0=Math.min(x0,f.nx);y0=Math.min(y0,f.ny);x1=Math.max(x1,f.nx+BW);y1=Math.max(y1,f.ny+thumbH(f));});

  const ox=(cw-(x1-x0)*sc)/2-x0*sc, oy=padT+((ch-padT-padB)-(y1-y0)*sc)/2-y0*sc;
  miniMap={sc,ox,oy};

  for(let i=0;i<frames.length-1;i++){
    const a=ctr(frames[i]), b=ctr(frames[i+1]);

  }
  frames.forEach((f,i)=>{
    const x=ox+f.nx*sc, y=oy+f.ny*sc, w=BW*sc, h=thumbH(f)*sc, im=miniImg(f);

function wrapText(ctx,text,x,y,maxW,lh,maxLines){
  const words=text.split(/\s+/); let line='',n=0;

const AS_DB='storyboard-stage', AS_STORE='kv', AS_KEY='project', AS_LS='storyboard-stage-project';
let asDbP=null;
function idb(){

    if(!window.indexedDB) return rej(new Error('no indexedDB'));
    const r=indexedDB.open(AS_DB,1);
    r.onupgradeneeded=()=>r.result.createObjectStore(AS_STORE);
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
  return asDbP;
}
async function idbGet(k){const db=await idb();return new Promise((res,rej)=>{const q=db.transaction(AS_STORE,'readonly').objectStore(AS_STORE).get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}

  const go=()=>{
    let d; try{d=JSON.stringify(projectData());}catch(err){return;}
    idbSet(AS_KEY,d).catch(()=>{try{localStorage.setItem(AS_LS,d);}catch(err){toast('Could not save on this device. Use Save project.');}});
  };
  if(now) go(); else asT=setTimeout(go,1200);
}
['pointerup','change','click','keyup','input'].forEach(ev=>document.addEventListener(ev,()=>autosave()));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')autosave(true);});
window.addEventListener('pagehide',()=>autosave(true));
async function restoreAutosave(){
  let raw=null;
  try{raw=await idbGet(AS_KEY);}catch(err){}
  if(!raw){try{raw=localStorage.getItem(AS_LS);}catch(err){}}
  if(raw){
    try{const d=typeof raw==='string'?JSON.parse(raw):raw; if(d&&d.app==='storyboard-stage'){applyProject(d);toast('Welcome back. Your work was restored');}}
    catch(err){}
  }
  asReady=true;
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(err){}
}
function newProject(){
  frames=[]; locations=[]; renderLocations(); bv.sel=null;
  world.showRoom=false; world.groups=[]; rebuildWorld([newItem('room',0,0)]);
  clearChars(); addChar({name:'Alex',x:-.6,z:-.3,rot:25,pose:'stand'}); addChar({name:'Blake',x:.8,z:-.5,rot:-30,pose:'sit'}); sel=0;
  Object.assign(cam,{x:CAM_HOME.x,y:CAM_HOME.y,z:CAM_HOME.z,yaw:0,pitch:0,roll:0}); updateCamPose();
  setRoom(); fitDirector(); renderChips(); renderItemEditor(); renderItemList(); renderShots(); refreshUI();
  hist.undo.length=0; hist.redo.length=0; hist.cur=sceneJSON(); syncUndoBtns();
  autosave(true); toast('New project started. Your models are still in the Library');
}

/* =====================================================================
   Start
   ===================================================================== */
try{setModels(JSON.parse(localStorage.getItem(MODEL_KEY)||'[]'));}catch(err){setModels([]);}
renderModelPanel(); renderLibrary(); renderPalette();
setRoom();
fitDirector();
world.showRoom=false; rebuildWorld([newItem('room',0,0)]);
addChar({name:'Alex',x:-.6,z:-.3,rot:25,pose:'stand'});
addChar({name:'Blake',x:.8,z:-.5,rot:-30,pose:'sit'});
sel=0;
updateShotCam(); renderChips(); renderItemList(); renderShots(); refreshUI();
setView('director');
setAppMode('build',true);
resize();
hist.cur=sceneJSON(); syncUndoBtns();
restoreAutosave();
requestAnimationFrame(loop);
})();
</script>
