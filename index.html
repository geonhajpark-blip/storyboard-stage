<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Storyboard Stage</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#15161a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Storyboard">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
:root{
  --panel:#f3f4f2; --panel-2:#e3e5e1; --card:#fbfbfa; --ink:#15181a; --ink-2:#5d6460; --line:#d3d7d2;
  --tape:#f5c400; --tape-ink:#16150f; --danger:#c2362b;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --panel:#17191b; --panel-2:#23262a; --card:#1d2023; --ink:#eceeea; --ink-2:#98a09a; --line:#2e3236;
    --tape:#f5c400; --tape-ink:#16150f; --danger:#ff6b5e;
    color-scheme: dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%;height:100lvh;margin:0;background:#15161a;color:var(--ink);
  font:14px/1.35 "Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--tape);outline-offset:2px}

#app{position:fixed;left:0;top:0;width:100vw;height:100vh;width:100dvw;height:100dvh;overflow:hidden;
  --pw:clamp(290px,calc(var(--aw,100vw)*.34),400px)}
/* Portrait phones: rotate the whole app a quarter turn so it always runs horizontally */
html.rot #app{width:var(--aw);height:var(--ah);transform-origin:0 0;transform:rotate(90deg) translateY(-100%)}
html.compact .stick{width:98px;height:98px;bottom:12px}
html.compact .stick .knob{width:40px;height:40px;margin:-20px 0 0 -20px}
html.compact .tiltpad{bottom:12px}
html.compact .tiltpad button{height:40px}
html.compact #tabs button{padding:10px 2px 8px}
#modeSeg .sm{display:none}
html.compact #modeSeg .lg{display:none}
html.compact #modeSeg .sm{display:inline}
html.compact .topbar{top:6px;left:6px;right:6px;gap:6px}
html.compact .seg button{padding:7px 9px;font-size:12px}
html.compact .tbtn{padding:8px 10px;font-size:12px}
html.compact .tbtn.sq{min-width:34px;padding:8px 0}
html.compact .shotbtn{padding:8px 11px;font-size:12px}
html.compact .topright{gap:6px}
html.compact #presetBar button{padding:7px 12px;font-size:12px}
html.compact #panel{right:6px;bottom:6px}
html.compact .shot{grid-template-columns:104px minmax(0,1fr)}

/* ---------- stage ---------- */
#stage{position:absolute;inset:0;background:#15161a;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.topbar{position:absolute;top:10px;left:10px;right:10px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.topbar>*{pointer-events:auto}
.seg{display:flex;background:var(--panel-2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 10px;border-radius:8px;font-weight:600;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.22)}
.seg.glass{background:rgba(18,19,22,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.seg.glass button{color:#aeb4b0}
.seg.glass button.on{background:#f1f2ee;color:#15181a}
.shotbtn{display:flex;align-items:center;gap:8px;background:var(--tape);color:var(--tape-ink);padding:10px 14px;border-radius:10px;font-weight:700;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.shotbtn:active{transform:translateY(1px)}
.shotbtn i{width:10px;height:10px;border-radius:50%;background:var(--tape-ink);display:block}

#frame{position:absolute;pointer-events:none;display:none;border:1px solid rgba(255,255,255,.4);color:#fff;
  font:11px/1.2 ui-monospace,"SF Mono",Menlo,Consolas,monospace;text-shadow:0 1px 2px rgba(0,0,0,.8)}
#stillImg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;pointer-events:none}
#frame .g{position:absolute;background:rgba(255,255,255,.28);display:none}
#frame.thirds .g{display:block}
#frame .v1{left:33.333%;top:0;bottom:0;width:1px}
#frame .v2{left:66.666%;top:0;bottom:0;width:1px}
#frame .h1{top:33.333%;left:0;right:0;height:1px}
#frame .h2{top:66.666%;left:0;right:0;height:1px}
#frame .tl{position:absolute;left:8px;top:7px;display:flex;align-items:center;gap:6px}
#frame .tl i{width:8px;height:8px;border-radius:50%;background:#ff4a3d;display:block}
#frame .bl{position:absolute;left:8px;bottom:7px}
#vlabel{position:absolute;right:12px;bottom:10px;color:#cfd3cf;font:11px/1.2 ui-monospace,Menlo,Consolas,monospace;text-shadow:0 1px 2px #000;pointer-events:none;display:none}
.topright{display:flex;flex-wrap:wrap;justify-content:flex-end;margin-left:auto;gap:8px;align-items:center}
.tbtn:disabled{opacity:.35;cursor:default}
.tbtn.sq{min-width:40px;padding:10px 0;font-size:16px;line-height:1}
.tbtn{background:rgba(18,19,22,.78);color:#e8eae6;padding:10px 12px;border-radius:10px;font-weight:600;font-size:13px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);white-space:nowrap}
.tbtn.on{background:#f1f2ee;color:#15181a}
.fitbtn{background:rgba(18,19,22,.78);color:#e8eae6;padding:10px 12px;border-radius:10px;font-weight:600;font-size:13px;display:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#pip{position:absolute;display:none;border:2px solid var(--tape);border-radius:3px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.5)}
#pip{touch-action:none;user-select:none;-webkit-user-select:none}
#pip.dragging{cursor:grabbing;opacity:.9}
#pip .rz{position:absolute;right:-2px;top:-2px;width:30px;height:30px;cursor:nesw-resize;touch-action:none;
  background:linear-gradient(225deg,var(--tape) 0 9px,transparent 9px),linear-gradient(225deg,transparent 0 13px,var(--tape) 13px 16px,transparent 16px)}
#pip span{position:absolute;left:4px;top:3px;pointer-events:none;font:10px/1 ui-monospace,Menlo,Consolas,monospace;color:#fff;text-shadow:0 1px 2px #000}
#hint{position:absolute;left:10px;top:calc(var(--tb,48px) + 56px);max-width:calc(100% - 214px);background:rgba(18,19,22,.82);color:#e8eae6;padding:8px 12px;border-radius:999px;
  font-size:12px;white-space:nowrap;opacity:0;transition:opacity .25s;pointer-events:none;max-width:94%;overflow:hidden;text-overflow:ellipsis}
#hint.show{opacity:1}


/* preset strip + minimap */
#presetBar{position:absolute;top:calc(var(--tb,48px) + 10px);left:10px;right:196px;display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:2px 2px 6px;z-index:6;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x}
#presetBar::-webkit-scrollbar{display:none}
#presetBar button{flex:0 0 auto;border-radius:999px;padding:9px 14px;font-weight:600;font-size:13px;background:rgba(18,19,22,.82);color:#e8eae6;white-space:nowrap;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#presetBar button.pcat{background:rgba(245,196,0,.2);color:#f5c400}
#presetBar button.pcat.on{background:#f5c400;color:#15161a}
#presetBar button.pchip.on{background:#f1f2ee;color:#15181a}
#presetBar .psep{flex:0 0 1px;background:rgba(255,255,255,.3);margin:6px 2px}
#mini{position:absolute;top:calc(var(--tb,48px) + 10px);right:10px;width:176px;height:108px;border-radius:12px;background:rgba(18,19,22,.84);border:1px solid rgba(255,255,255,.18);overflow:hidden;z-index:7;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#miniCv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:pointer}
#miniBtn{position:absolute;right:4px;bottom:4px;width:28px;height:28px;border-radius:8px;background:rgba(0,0,0,.6);color:#fff;font-size:15px;line-height:1}
#miniTag{position:absolute;left:8px;top:5px;font:600 10px/1 system-ui,sans-serif;color:rgba(255,255,255,.7);pointer-events:none;letter-spacing:.05em}
#presetList{position:absolute;top:calc(var(--tb,48px) + 56px);left:10px;z-index:9;display:none;flex-direction:column;gap:2px;min-width:180px;max-width:240px;max-height:calc(100% - 120px);overflow-y:auto;
  background:rgba(18,19,22,.92);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:6px;box-shadow:0 6px 18px rgba(0,0,0,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#presetList .phead{font:700 11px/1 system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#f5c400;padding:8px 10px 6px}
#presetList button{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:8px;font-weight:600;font-size:13px;color:#e8eae6}
#presetList button:hover{background:rgba(255,255,255,.08)}
#presetList button.on{background:#f1f2ee;color:#15181a}
#presetBar button.pcat.act{box-shadow:inset 0 0 0 2px #f5c400}
#stage.mode-build #presetBar{right:10px}
#stage.clean #presetList,#stage.boardmode #presetList,
#stage.clean #mini,#stage.clean #presetBar,#stage.boardmode #mini,#stage.boardmode #presetBar{display:none!important}

/* ---------- FPV sticks ---------- */
#sticks{position:absolute;inset:0;pointer-events:none;display:none}
.stick{position:absolute;bottom:18px;width:116px;height:116px;border-radius:50%;pointer-events:auto;touch-action:none;
  background:radial-gradient(circle,rgba(255,255,255,.10) 0 34%,rgba(18,19,22,.42) 35%);border:2px solid rgba(255,255,255,.38)}
.stick::before,.stick::after{content:"";position:absolute;background:rgba(255,255,255,.22);pointer-events:none}
.stick::before{left:50%;top:10px;bottom:10px;width:1px}
.stick::after{top:50%;left:10px;right:10px;height:1px}
.stick .knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(245,196,0,.92);box-shadow:0 2px 8px rgba(0,0,0,.5);pointer-events:none}
.stick .cap{position:absolute;left:50%;transform:translateX(-50%);top:-20px;font-size:11px;color:rgba(255,255,255,.72);white-space:nowrap;text-shadow:0 1px 2px #000;pointer-events:none}
#stickL{left:14px}
#stickR{right:14px}
.mpad{position:absolute;bottom:14px;pointer-events:auto;touch-action:none;display:grid;gap:6px;user-select:none;-webkit-user-select:none}
#mpadMove{left:14px;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px)}
#mpadLift{right:14px;grid-template-columns:62px;grid-template-rows:48px 48px}
.mpad button{border-radius:12px;background:rgba(18,19,22,.72);color:#eef0ec;border:1px solid rgba(255,255,255,.28);font-size:17px;font-weight:700;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);touch-action:none}
.mpad.lift button{font-size:13px}
.mpad button.held{background:var(--tape);color:var(--tape-ink);border-color:var(--tape)}
.mpad .mid{display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.6);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
html.compact #mpadMove{grid-template-columns:repeat(3,42px);grid-template-rows:repeat(3,42px)}
html.compact #mpadLift{grid-template-rows:42px 42px}
#app.panelopen #mpadLift{right:calc(var(--pw) + 24px)}
.tiltpad{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:8px;pointer-events:auto}
.tiltpad button{width:58px;height:46px;border-radius:12px;background:rgba(18,19,22,.7);color:#e8eae6;font-size:12px;font-weight:600;border:1px solid rgba(255,255,255,.3);touch-action:none;line-height:1.1}
.tiltpad button.held{background:var(--tape);color:var(--tape-ink)}

/* ---------- panel ---------- */
/* floating glass panel, opened from the panel icon */
#panel{position:absolute;top:calc(var(--tb,48px) + 10px);right:10px;bottom:10px;width:var(--pw);z-index:20;display:none;flex-direction:column;min-height:0;overflow:hidden;
  border-radius:16px;border:1px solid var(--line);box-shadow:0 10px 32px rgba(0,0,0,.35);
  background:var(--glass);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);
  --glass:rgba(244,245,243,.52);--card:rgba(255,255,255,.42);--panel-2:rgba(20,24,22,.07);--line:rgba(20,24,22,.12)}
@media (prefers-color-scheme: dark){#panel{--glass:rgba(22,24,27,.5);--card:rgba(255,255,255,.06);--panel-2:rgba(255,255,255,.09);--line:rgba(255,255,255,.12)}}
#app.panelopen #panel{display:flex}
#app.uiclean #panel{display:none!important}
#panelBtn svg{width:18px;height:18px;display:block;margin:0 auto}
#app.panelopen #mini{right:calc(var(--pw) + 20px)}
#app.panelopen #stickR{right:calc(var(--pw) + 24px)}
#app.panelopen #stage.mode-build #presetBar{right:calc(var(--pw) + 20px)}
#stage.clean #modeSeg,#stage.clean #panelBtn{display:none!important}
#camGoBtn{display:none}
#stage:not(.mode-pose) #camGoBtn{display:block}
#stage.clean #camGoBtn,#stage.boardmode #camGoBtn{display:none!important}
#castBtn{display:none}
#stage:not(.mode-pose) #castBtn{display:block}
#stage.clean #castBtn,#stage.boardmode #castBtn,#stage.clean #castPop,#stage.boardmode #castPop{display:none!important}
#castPop{position:absolute;top:calc(var(--tb,48px) + 10px);right:calc(196px + var(--sr,0px));width:min(300px,62%);z-index:12;display:none;padding:10px 12px 12px;border-radius:14px;
  background:rgba(18,19,22,.9);color:#eceeea;border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);max-height:calc(100% - var(--tb,48px) - 24px);overflow:auto}
#app.panelopen #castPop{right:calc(var(--pw) + 20px + var(--sr,0px))}
#castPop .cphd{display:flex;align-items:center;justify-content:space-between;font-size:13px;margin-bottom:6px}
#castPop .cphd.sub{margin-top:12px}
#castPop .cpx{width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.1);color:#eceeea}
#castPop .cplist{display:flex;flex-wrap:wrap;gap:6px}
#castPop .cpchip{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.08);color:#c9ccc8;font-weight:600;font-size:12.5px;border:2px solid transparent}
#castPop .cpchip.on{border-color:var(--tape);color:#fff}
#castPop .cpchip.add{border:1.5px dashed rgba(255,255,255,.3)}
#castPop .cpchip i{width:10px;height:10px;border-radius:50%;display:block}
#castPop .cpacts{display:flex;gap:6px;margin-top:8px}
#castPop .cpgo{flex:1;padding:9px 10px;border-radius:9px;background:var(--tape);color:var(--tape-ink);font-weight:700;font-size:12.5px}
#castPop .cpwarn{padding:9px 10px;border-radius:9px;background:rgba(255,255,255,.08);color:#ff8a80;font-weight:700;font-size:12.5px}
#castPop .cprow{display:flex;align-items:center;gap:8px}
#castPop .cprow input[type=range]{flex:1}
#castPop .num{width:56px;padding:5px 6px;border-radius:7px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.3);color:#fff;text-align:right;font:inherit;font-size:13px}
#refBtn{display:none}
#stage.mode-direct #refBtn{display:block}
#stage.clean #refBtn,#stage.boardmode #refBtn{display:none!important}
#mViewSeg,#mTools{display:none}
#stage.mode-model #mViewSeg{display:flex}
#stage.mode-model #mTools{display:flex}
#stage.clean #mViewSeg,#stage.clean #mTools{display:none!important}
#mTools{position:absolute;left:10px;right:10px;bottom:10px;z-index:7;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none;padding:6px;border-radius:14px;background:rgba(18,19,22,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);touch-action:pan-x}
#mTools::-webkit-scrollbar{display:none}
#mTools button{flex:0 0 auto;padding:9px 12px;border-radius:9px;font-weight:600;font-size:12.5px;color:#e8eae6;background:rgba(255,255,255,.08);white-space:nowrap}
#mTools button[data-add]{background:rgba(245,196,0,.18);color:#f5c400}
#mTools button.warn{color:#ff6b5e}
#mTools .tl{color:#9aa09b;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:0 4px;flex:none}
#mTools .sep{flex:0 0 1px;align-self:stretch;background:rgba(255,255,255,.2);margin:4px 2px}
#app.panelopen #mTools{right:calc(var(--pw) + 20px)}
html.compact #mTools button{padding:7px 10px;font-size:12px}
#stage.mode-pose #viewSeg,#stage.mode-pose #presetBar,#stage.mode-pose #presetList,#stage.mode-pose #mini,#stage.mode-pose #shotBtn,#stage.mode-pose #pip,#stage.mode-pose #fitBtn,#stage.mode-pose #vlabel,#stage.mode-pose #placebar,#stage.mode-pose #sticks,#stage.mode-pose #frame,#stage.mode-pose #stickBtn,
#stage.mode-model #viewSeg,#stage.mode-model #presetBar,#stage.mode-model #presetList,#stage.mode-model #mini,#stage.mode-model #shotBtn,#stage.mode-model #pip,
#stage.mode-model #fitBtn,#stage.mode-model #vlabel,#stage.mode-model #placebar,#stage.mode-model #sticks,#stage.mode-model #frame,#stage.mode-model #stickBtn{display:none!important}
.mrow{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:var(--card)}
.mrow.on{box-shadow:inset 3px 0 0 var(--tape)}
.mrow .mhd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mrow .mhd b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .mhd span{color:var(--ink-2);font-size:12px;white-space:nowrap}
.mrow .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.mrow .acts button{padding:6px 10px;border-radius:8px;background:var(--panel-2);font-size:12px;font-weight:600}
.mrow .acts button.warn{color:var(--danger)}
.btn[disabled]{opacity:.45;cursor:default}
/* clean mode: only the picture, a Show button and a small record dot */
#stage.clean #undoBtn,#stage.clean #redoBtn,#stage.clean #viewSeg,#stage.clean .fitbtn,#stage.clean #stickBtn,#stage.clean #pip,#stage.clean #vlabel,#stage.clean #hint,#stage.clean #placebar,#stage.clean #sticks,#stage.clean #frame .tl,#stage.clean #frame .bl{display:none!important}
#stage.clean #shotBtn{padding:12px;font-size:0;gap:0}
#stage.clean #uiBtn{opacity:.6}
/* shots as nodes */
#board{position:absolute;inset:0;display:none;z-index:6;background-color:#15161a;
  background-image:radial-gradient(rgba(255,255,255,.09) 1.2px,transparent 1.4px);background-size:24px 24px;overflow:hidden}
#stage.boardmode #board{display:block}
#stage.boardmode #viewSeg,#stage.boardmode .fitbtn,#stage.boardmode #stickBtn,#stage.boardmode #pip,#stage.boardmode #frame,#stage.boardmode #sticks,#stage.boardmode #vlabel,#stage.boardmode #placebar,#stage.boardmode #hint{display:none!important}
#stage.boardmode .topbar{z-index:8;pointer-events:none}
#boardView{position:absolute;inset:0;touch-action:none;cursor:grab}
#boardWorld{position:absolute;left:0;top:0;transform-origin:0 0}
#wires{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none;color:var(--tape)}
#wires path{fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round}
#wires path.tmp{stroke-dasharray:6 6;opacity:.8}
#nodes{position:absolute;left:0;top:0}
.node{position:absolute;background:#1f2226;border:2px solid #343840;border-radius:12px;color:#eceeea;box-shadow:0 4px 14px rgba(0,0,0,.45);touch-action:none;user-select:none;-webkit-user-select:none}
.node.sel{border-color:var(--tape)}
.node.drop{border-color:#fff;box-shadow:0 0 0 3px rgba(245,196,0,.6)}
.node .thumb{position:relative;border-radius:10px 10px 0 0;overflow:hidden;background:#000}
.node .thumb img{width:100%;height:100%;display:block;object-fit:cover;pointer-events:none}
.node .num{position:absolute;left:6px;top:6px;background:var(--tape);color:var(--tape-ink);font-weight:800;font-size:12px;min-width:22px;height:22px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 6px}
.node .foot{padding:7px 10px 9px;font-size:12px;pointer-events:none}
.node .foot b{font-size:13px;margin-right:6px}
.node .foot span{color:#9aa09b}
.node .foot p{margin:4px 0 0;color:#c9ccc8;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:0}
.node .foot p:empty{display:none}
.port{position:absolute;width:26px;height:26px;border-radius:50%;background:#2b2f35;border:3px solid var(--tape);touch-action:none}
.port.in{left:-15px}
.port.out{right:-15px;cursor:crosshair;background:var(--tape)}

#tabs button.hide{display:none}

details.folder[open]>summary{border-bottom:1px solid var(--line)}

section{display:none}

.row{display:grid;grid-template-columns:84px minmax(0,1fr) 118px;align-items:center;gap:8px;margin:6px 0}

.btn{padding:10px 14px;border-radius:10px;background:var(--panel-2);font-weight:600;font-size:13px}

.grphd{display:flex;align-items:stretch;border-bottom:1px solid var(--line)}

.grphd .cnt{margin-left:auto;color:var(--ink-2);font-weight:600;font-size:12px}
.list button.inner{padding-left:44px}
.list .tick{display:inline-block;width:15px;height:15px;border-radius:4px;border:2px solid var(--ink-2);margin-right:9px;vertical-align:-2px}
.list .tick.on{background:var(--tape);border-color:var(--tape)}
.list{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.list button{display:block;width:100%;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px}
.list button:last-child{border-bottom:0}
.list button.on{font-weight:700;box-shadow:inset 3px 0 0 var(--tape)}
.itemhd{font-weight:700;font-size:15px;margin:8px 0 2px}
#placebar{position:absolute;left:10px;top:calc(var(--tb,48px) + 56px);display:none;align-items:center;gap:10px;background:var(--tape);color:var(--tape-ink);padding:6px 6px 6px 14px;border-radius:999px;font-size:12.5px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.35);white-space:nowrap}
#placebar button{background:var(--tape-ink);color:var(--tape);padding:6px 12px;border-radius:999px;font-weight:700;font-size:12px}
#stage.placing #placebar{display:flex}
#stage.placing #hint{top:calc(var(--tb,48px) + 98px)}
details.more{border:1px solid var(--line);border-radius:12px;margin:14px 0;background:var(--card);padding:0 12px}
details.more>summary{cursor:pointer;font-weight:700;font-size:13px;padding:11px 0;color:var(--ink-2);list-style:none}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:"+";float:right;font-weight:600}
details.more[open]>summary::after{content:"\2013"}
details.more>*:last-child{margin-bottom:10px}
.empty{padding:26px 8px;text-align:center;color:var(--ink-2)}
#toast{position:absolute;left:50%;bottom:18px;transform:translate(-50%,20px);background:#15181a;color:#fff;padding:10px 16px;border-radius:999px;
  font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:40;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
#app:has(#stage.mode-model) #toast{bottom:76px}
@media (prefers-reduced-motion:reduce){#hint,#toast{transition:none}}
/* keep the buttons clear of the phone's own bars (status bar, notch, home bar); the picture stays full screen */
.topbar{top:calc(10px + var(--st,0px));left:calc(10px + var(--sl,0px));right:calc(10px + var(--sr,0px))}
html.compact .topbar{top:calc(6px + var(--st,0px));left:calc(6px + var(--sl,0px));right:calc(6px + var(--sr,0px))}
#hint,#placebar,#boardBar{left:calc(10px + var(--sl,0px))}
#presetBar{left:calc(10px + var(--sl,0px));right:calc(196px + var(--sr,0px))}
#stage.mode-build #presetBar{right:calc(10px + var(--sr,0px))}
#app.panelopen #stage.mode-build #presetBar{right:calc(var(--pw) + 20px + var(--sr,0px))}

#app.panelopen #mini{right:calc(var(--pw) + 20px + var(--sr,0px))}

.mpad{bottom:calc(14px + var(--sb,0px))}
#mpadMove{left:calc(14px + var(--sl,0px))}
#mpadLift{right:calc(14px + var(--sr,0px))}

#mTools{left:calc(10px + var(--sl,0px));right:calc(10px + var(--sr,0px));bottom:calc(10px + var(--sb,0px))}
#app.panelopen #mTools{right:calc(var(--pw) + 20px + var(--sr,0px))}
#boardSheet{left:calc(10px + var(--sl,0px));right:calc(10px + var(--sr,0px));bottom:calc(10px + var(--sb,0px))}
#vlabel{right:calc(12px + var(--sr,0px));bottom:calc(10px + var(--sb,0px))}
#toast{bottom:calc(18px + var(--sb,0px))}
#app:has(#stage.mode-model) #toast{bottom:calc(76px + var(--sb,0px))}
#inkEd .inkbar{padding-left:calc(10px + var(--sl,0px));padding-right:calc(10px + var(--sr,0px))}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="gl"></canvas>
    <div id="frame" class="thirds">
      <div class="g v1"></div><div class="g v2"></div><div class="g h1"></div><div class="g h2"></div>

        <button data-k="str-" aria-label="Slide left" title="Slide left (A or Left arrow)">&#9664;</button><span class="mid">Walk</span><button data-k="str+" aria-label="Slide right" title="Slide right (D or Right arrow)">&#9654;</button>
        <span></span><button data-k="fwd-" aria-label="Back" title="Back (S or Down arrow)">&#9660;</button><span></span>

        <button class="tbtn" id="bBack">Back to 3D</button>

          <button id="shEarlier">Earlier</button><button id="shLater">Later</button>
          <button id="shOpen">Open</button><button id="shDraw">Draw</button><button id="shPic">Picture</button><button id="shReplace">Use 3D</button><button id="shDelete" class="warn">Delete</button>

<script>
(function(){
'use strict';
const D2R=Math.PI/180, R2D=180/Math.PI;
const $=(s,r=document)=>r.querySelector(s);
/* Claude features (AI models, matching a still) work only inside the published Claude page */
const HAS_AI=!!(window.claude&&typeof window.claude.use==='function');
const APP_VERSION='21 (14 Nov 2026)';
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const stage=$('#stage'), canvas=$('#gl');

if(!window.THREE){ stage.innerHTML='<p style="color:#fff;padding:24px">Three.js could not be loaded. Check your connection and reload.</p>'; return; }

/* sRGB hex -> linear colour, so lit surfaces look the way their hex says */
const C=hex=>new THREE.Color(hex).convertSRGBToLinear();

/* ---------- landscape layout ---------- */
const root=document.documentElement;
let forceLandscape=true;
/* the phone's own bars (time, battery, notch, home bar): keep the app out from under them */
const safeProbe=document.createElement('div');
safeProbe.style.cssText='position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)';
document.body.appendChild(safeProbe);
const safe={t:0,r:0,b:0,l:0};
function readSafe(){const c=getComputedStyle(safeProbe);safe.t=parseFloat(c.paddingTop)||0;safe.r=parseFloat(c.paddingRight)||0;safe.b=parseFloat(c.paddingBottom)||0;safe.l=parseFloat(c.paddingLeft)||0;}
/* the app always uses the whole screen; only the buttons step in from the phone's bars (in app coordinates) */
const safeApp={l:0,r:0,t:0,b:0};
const isStandalone=()=>!!(navigator.standalone||matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches);
let appIW=window.innerWidth, layoutInfo='';
function applyLayout(){
  readSafe();
  let iw=window.innerWidth, ih=window.innerHeight;
  const de=document.documentElement, vv=window.visualViewport;
  iw=Math.max(iw,de.clientWidth||0); ih=Math.max(ih,de.clientHeight||0);
  if(isStandalone()&&screen.width&&screen.height){
    const a=Math.min(screen.width,screen.height), b=Math.max(screen.width,screen.height);

function windowTex(cols,rows,wall,seed,kind){
  const px=Math.max(6,Math.min(32,Math.floor(256/Math.max(cols,rows)))), cv=document.createElement('canvas'); cv.width=cols*px; cv.height=rows*px;
  const ctx=cv.getContext('2d');

  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const lit=hash3(seed,c,r)<.42, pd=Math.max(1,Math.round(px*.22)), x=c*px+pd, y=r*px+Math.round(px*.25), w=px-pd*2, h=px-pd*2;
    if(kind==='map'){ctx.fillStyle=lit?'#f3d9a4':'#2d3b4a';ctx.fillRect(x,y,w,h);}
    else if(lit){ctx.fillStyle='#ffcf8a';ctx.fillRect(x,y,w,h);}
  }
  const t=new THREE.CanvasTexture(cv); t.encoding=THREE.sRGBEncoding; t.anisotropy=4; return t;
}

const fieldImg={};
function fieldTex(crop,w,d){
  if(!fieldImg[crop]){
    const cv=document.createElement('canvas'); cv.width=cv.height=64; const c=cv.getContext('2d');
    const pal={wheat:['#d8b65a','#b8933e','#e6cb7a'],sunflower:['#4d6b2b','#35501d','#5f7d33'],plowed:['#6a4f3a','#4a3628','#7a5c44'],grass:['#7a9a4c','#668840','#8aa858']}[crop]||['#777','#666','#888'];

    for(let k=0;k<160;k++){c.fillStyle=pal[2];c.globalAlpha=.5;c.fillRect((k*37)%64,(k*53)%64,2,2);}
    c.globalAlpha=1; if(crop==='sunflower'){for(let k=0;k<40;k++){const x=(k*29)%60+2,y=(k*47)%60+2;c.fillStyle='#f0c020';c.beginPath();c.arc(x,y,3.2,0,6.3);c.fill();c.fillStyle='#4a3018';c.beginPath();c.arc(x,y,1.3,0,6.3);c.fill();}}

  }

}
/* thousands of sunflowers in a few draw calls: one stem, one petal disc and one seed disc, repeated */
function sunflowers(g,w,d,seed){
  const step=Math.max(.95,Math.sqrt(w*d/2400)), nx=Math.max(1,Math.floor(w/step)), nz=Math.max(1,Math.floor(d/step)), n=nx*nz;
  const stemG=new THREE.CylinderGeometry(.03,.04,1,3,1,true); stemG.translate(0,.5,0);
  const leafG=new THREE.PlaneGeometry(.55,.3); leafG.rotateX(-Math.PI/2.6);
  const headG=new THREE.CircleGeometry(.27,9);
  const seedG=new THREE.CircleGeometry(.13,6); seedG.translate(0,0,.02);
  const mk=(geo,col,r)=>{const m=new THREE.InstancedMesh(geo,new THREE.MeshStandardMaterial({color:C(col),roughness:r,side:THREE.DoubleSide}),n);m.castShadow=false;m.receiveShadow=true;m.userData.flat=true;m.raycast=()=>{};g.add(m);return m;};
  const stem=mk(stemG,'#4f6e2a',.9), leaf=mk(leafG,'#3f6224',.9), head=mk(headG,'#f2c21b',.7), core=mk(seedG,'#4a3018',1);
  const M=new THREE.Matrix4(), q=new THREE.Quaternion(), e=new THREE.Euler(), p=new THREE.Vector3(), sc=new THREE.Vector3();
  let i=0;
  for(let a=0;a<nx;a++)for(let b=0;b<nz;b++){
    const x=-w/2+(a+.5)*w/nx+(hash3(seed,a,b)-.5)*step*.5, z=-d/2+(b+.5)*d/nz+(hash3(seed,b,a)-.5)*step*.5, h=1.45+hash3(a,b,seed)*.6;
    M.compose(p.set(x,0,z),q.identity(),sc.set(1,h,1)); stem.setMatrixAt(i,M);
    e.set(0,hash3(seed,a,b)*6.28,0); M.compose(p.set(x,h*.55,z),q.setFromEuler(e),sc.set(1,1,1)); leaf.setMatrixAt(i,M);
    e.set(-.35+(hash3(b,seed,a)-.5)*.3,(hash3(a,seed,b)-.5)*.5,0); q.setFromEuler(e);
    M.compose(p.set(x,h,z+.1),q,sc.set(1,1,1)); head.setMatrixAt(i,M); core.setMatrixAt(i,M);
    i++;
  }
  [stem,leaf,head,core].forEach(m=>m.instanceMatrix.needsUpdate=true);
}
function disposeGroup(g){
  g.traverse(n=>{
    if(n.geometry)n.geometry.dispose();
    if(n.material){[].concat(n.material).forEach(m=>{if(m.map)m.map.dispose();if(m.emissiveMap)m.emissiveMap.dispose();glowMats.delete(m);m.dispose();});}
  });
  if(g.userData.lampId!==undefined) lampReg.delete(g.userData.lampId);
}

/* ---------- road junctions: where two roads meet or cross, they join ---------- */
function roadJunctions(it,L){
  const out=[], ax=it.x, az=it.z, ux=(it.x2-ax)/L, uz=(it.z2-az)/L, nx=uz, nz=-ux;
  world.items.forEach(o=>{
    if(o===it||o.id===it.id||o.type!=='road') return;
    const Lb=Math.hypot(o.x2-o.x,o.z2-o.z); if(Lb<.5) return;
    const vx=(o.x2-o.x)/Lb, vz=(o.z2-o.z)/Lb, cr=ux*vz-uz*vx;
    if(Math.abs(cr)<.25) return;                       /* nearly parallel: no junction */
    const dx=o.x-ax, dz=o.z-az, sA=(dx*vz-dz*vx)/cr, sB=(dx*uz-dz*ux)/cr;
    const ow=o.w/2+(o.walk?2.2:0), mw=it.w/2+(it.walk?2.2:0);
    if(sA<-ow-.3||sA>L+ow+.3||sB<-mw-.3||sB>Lb+mw+.3) return;
    const jx=ax+ux*sA, jz=az+uz*sA, occ={'-1':false,'1':false};
    [[o.x,o.z],[o.x2,o.z2]].forEach(([px,pz])=>{const lat=(px-jx)*nx+(pz-jz)*nz;if(Math.abs(lat)>.5)occ[lat>0?'1':'-1']=true;});
    out.push({s:sA,sin:Math.abs(cr),bw:o.w,bwalk:o.walk?2.2:0,occ,end:sA>L-.6,start:sA<.6});
  });
  return out;
}
let roadSig='';
function syncRoads(){

  if(sig===roadSig) return; roadSig=sig;
  world.items.forEach(i=>{if(i.type==='road'&&itemObjs.has(i.id))rebuildItem(i);});
}

/* ---------- magnetic snapping: ends, edges, corners and parallel / square angles ---------- */
const snapInfo={on:false,x:0,z:0};
const snapMark=new THREE.Group();
(function(){

function updateSnapMark(h){

const wrapRad=v=>((v+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;
function magnetR(){
  const b=world.magnetR;
  return view==='top'?Math.max(b,12*ov.top.span/Math.max(1,stage.clientHeight)):b;
}
function nearestOnSeg(p,sg){
  const dx=sg[2]-sg[0], dz=sg[3]-sg[1], L2=dx*dx+dz*dz;
  let t=L2?((p[0]-sg[0])*dx+(p[1]-sg[1])*dz)/L2:0; t=Math.max(0,Math.min(1,t));

function rectPts(f){
  const r=f.rot*D2R, c=Math.cos(r), s=Math.sin(r), hw=f.w/2, hd=f.d/2;
  const W=(lx,lz)=>[f.cx+lx*c+lz*s,f.cz-lx*s+lz*c];
  return {center:[f.cx,f.cz],corners:[W(-hw,-hd),W(hw,-hd),W(hw,hd),W(-hw,hd)],mids:[W(0,-hd),W(hw,0),W(0,hd),W(-hw,0)]};
}
/* everything an item can stick to: points, line segments (kind 'c' = a road's centre line), and angles */
function snapTargets(exceptId){
  const T={pts:[],segs:[],angles:[]};
  const addRect=f=>{
    const R=rectPts(f); T.pts.push(R.center,...R.corners,...R.mids);
    for(let i=0;i<4;i++){const a=R.corners[i],b=R.corners[(i+1)%4];T.segs.push([a[0],a[1],b[0],b[1],'e']);}
    T.angles.push(f.rot*D2R,f.rot*D2R+Math.PI/2);
  };
  if(world.showRoom) addRect({cx:0,cz:0,w:room.w,d:room.d,rot:0});
  world.items.forEach(it=>{
    if(it.id===exceptId) return;
    if(CATALOG[it.type].line){
      const dx=it.x2-it.x, dz=it.z2-it.z, L=Math.hypot(dx,dz); if(L<.01) return;
      const nx=dz/L, nz=-dx/L, road=it.type==='road';
      T.pts.push([it.x,it.z],[it.x2,it.z2],[(it.x+it.x2)/2,(it.z+it.z2)/2]);
      const offs=[[0,road?'c':'e']];
      if(road){offs.push([-it.w/2,'e'],[it.w/2,'e']);if(it.walk)offs.push([-(it.w/2+2.2),'e'],[it.w/2+2.2,'e']);}
      if(it.type==='sidewalk') offs.push([-it.w/2,'e'],[it.w/2,'e']);
      offs.forEach(([o,k])=>T.segs.push([it.x+nx*o,it.z+nz*o,it.x2+nx*o,it.z2+nz*o,k]));
      const a=Math.atan2(dx,dz); T.angles.push(a,a+Math.PI/2);
    }else addRect(fpOf(it));

}
/* mine: [{p:[x,z], c:true if centre point}] ; returns the pull needed to stick to the closest target in reach */
function bestSnap(mine,T,R,allowRoadCentre){
  let best=null;
  mine.forEach(m=>{
    T.pts.forEach(t=>{
      const d=Math.hypot(t[0]-m.p[0],t[1]-m.p[1]), sc=d*.85;
      if(d<=R&&(!best||sc<best.s)) best={s:sc,dx:t[0]-m.p[0],dz:t[1]-m.p[1],x:t[0],z:t[1]};
    });
    if(!m.c) T.segs.forEach(sg=>{
      if(sg[4]==='c'&&!allowRoadCentre) return;
      const q=nearestOnSeg(m.p,sg), d=Math.hypot(q[0]-m.p[0],q[1]-m.p[1]);
      if(d<=R&&(!best||d<best.s)) best={s:d,dx:q[0]-m.p[0],dz:q[1]-m.p[1],x:q[0],z:q[1]};

}
function snapRect(it,cx,cz,rot,R,T){
  const P=rectPts(fpOf(Object.assign({},it,{x:cx,z:cz,rot})));

function snapPointMagnet(px,pz,exceptId){
  const hit=bestSnap([{p:[px,pz]}],snapTargets(exceptId),magnetR(),true);
  return hit?[hit.x,hit.z]:null;
}
function snapStart(px,pz){

  if(world.magnet){const h=snapPointMagnet(px,pz,-1);if(h){x=h[0];z=h[1];snapInfo.on=true;snapInfo.x=x;snapInfo.z=z;}}

}
function snapEnd(x0,z0,px,pz,exceptId){
  let ex=px, ez=pz;

  snapInfo.on=false;

  const T=snapTargets(exceptId), hit=bestSnap([{p:[px,pz]}],T,magnetR(),true);
  if(hit){ex=hit.x;ez=hit.z;snapInfo.on=true;snapInfo.x=ex;snapInfo.z=ez;return [ex,ez];}

function dragMove(x,y){
  const lim=v=>clamp(v,-CAM_LIMIT,CAM_LIMIT);

    const c=chars[drag.idx], p=groundXZ(x,y); if(!c||!p) return;
    c.x=clamp(p[0]+drag.dx,-WORLD_HALF,WORLD_HALF); c.z=clamp(p[1]+drag.dz,-WORLD_HALF,WORLD_HALF); placeChar(c);
  }else if(drag.type==='cam'){
    const p=groundXZ(x,y); if(!p) return;
    cam.x=lim(p[0]+drag.dx); cam.z=lim(p[1]+drag.dz); updateCamPose();
  }else if(drag.type==='cam2'){
    const p=planePoint(x,y), a=p[0]+drag.oa, b=p[1]+drag.ob;
    if(view==='top'){cam.x=lim(a);cam.z=lim(b);}
    else if(view==='front'){cam.x=lim(a);cam.y=clamp(b,.05,CAM_MAX_H);}
    else{cam.z=lim(a);cam.y=clamp(b,.05,CAM_MAX_H);}

  }else if(drag.type==='handle'){
    const p=planePoint(x,y);
    if(view==='top'){
      const dx=p[0]-cam.x, dz=p[1]-cam.z;
      if(Math.hypot(dx,dz)>1e-3) cam.yaw=Math.atan2(-dx,-dz)*R2D;
    }else{

    const ch=chars[sel]; if(!ch) return;
    const p=planePoint(x,y); if(Math.hypot(p[0]-ch.x,p[1]-ch.z)<.05) return;

const syncs=[], dynSyncs=[];
function refreshUI(){wake();syncs.forEach(f=>f());dynSyncs.forEach(f=>f());}
function addSlider(parent,o,bucket=syncs){
  const row=document.createElement('label'); row.className='row';
  row.innerHTML='<span class="lbl">'+o.label+'</span><input type="range" step="'+o.step+'"><span class="val"><input type="number" class="num" inputmode="decimal" step="any"><span class="unit"></span></span>';
  const inp=$('input[type=range]',row), num=$('.num',row), unit=$('.unit',row);
  const dec=String(o.step).includes('.')?String(o.step).split('.')[1].length:0;
  const show=v=>Number((+v).toFixed(dec));
  num.setAttribute('aria-label',o.label);
  inp.addEventListener('input',()=>{o.set(parseFloat(inp.value));refreshUI();});
  /* typed numbers: applied on Enter or when the box loses focus, kept inside the slider's range */
  const commit=()=>{
    const v=parseFloat(num.value), [mn,mx]=o.range?o.range():[o.min,o.max];
    if(isFinite(v)){o.set(clamp(v,mn,mx));refreshUI();}
    num.value=show(o.get());
  };
  num.addEventListener('change',commit);
  num.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();num.blur();}
    else if(e.key==='Escape'){num.value=show(o.get());num.blur();}
    e.stopPropagation();
  });
  num.addEventListener('click',e=>e.preventDefault());
  num.addEventListener('focus',()=>num.select());
  bucket.push(()=>{
    const [mn,mx]=o.range?o.range():[o.min,o.max];
    inp.min=mn; inp.max=mx; const v=o.get(); inp.value=v;
    if(document.activeElement!==num) num.value=show(v);
    /* unit beside the box: "1.5 m" -> "m"; labels that are not the number itself (Slim, 24°) are shown whole */
    const f=o.fmt?String(o.fmt(v)):'', m=f.match(/^\s*(-?[\d.]+)\s*(.*)$/);
    unit.textContent=m&&Math.abs(parseFloat(m[1])-v)<1e-6+Math.pow(10,-dec)?m[2]:f;
    unit.title=f;
  });
  parent.appendChild(row); return row;
}

  return new Promise((res,rej)=>{
    if(!file||!/^image\//.test(file.type)) return rej(new Error('not an image'));
    const url=URL.createObjectURL(file), im=new Image();
    im.onload=()=>{
      const k=Math.min(1,maxDim/Math.max(im.naturalWidth,im.naturalHeight)), w=Math.round(im.naturalWidth*k), h=Math.round(im.naturalHeight*k);
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(im,0,0,w,h);

const bp=new Map(); let bmode=null, bdrag=null, bpinch=null;

const castPick=new Set([0,1,2,3]);

const camFwd=()=>{const y=cam.yaw*D2R;return [[-Math.sin(y),-Math.cos(y)],[Math.cos(y),-Math.sin(y)]];};

  const list=idxs.filter(i=>chars[i]); if(!list.length){toast('Choose who to bring in');return;}
  const o=optics(), [F,Rt]=camFwd(), vf=o.vf*D2R, hf=o.hf*D2R;

  const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=pic.dataURL;});

  for(let r=0;r<rows;r++){rowY.push(y);y+=Math.max(...hs.slice(r*cols,r*cols+cols))+capH+gap;}
  const W=pad*2+cols*cw+(cols-1)*gap, H=y-gap+pad;
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H; const ctx=cv.getContext('2d');
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#15181a'; ctx.textBaseline='alphabetic';
  ctx.font='700 54px system-ui,sans-serif'; ctx.fillText('Storyboard',pad,pad+52);
  ctx.font='400 24px system-ui,sans-serif'; ctx.fillStyle='#5d6460';
  ctx.fillText(frames.length+' shots, '+new Date().toLocaleDateString(),pad,pad+92);
  imgs.forEach((im,i)=>{
    const r=Math.floor(i/cols), c=i%cols, x=pad+c*(cw+gap), yy=rowY[r];
    ctx.drawImage(im,x,yy,cw,hs[i]);
    ctx.strokeStyle='#15181a'; ctx.lineWidth=3; ctx.strokeRect(x,yy,cw,hs[i]);
    ctx.fillStyle='#15181a'; ctx.font='700 26px system-ui,sans-serif';
    ctx.fillText('Shot '+(i+1),x,yy+hs[i]+38);
    ctx.fillStyle='#5d6460'; ctx.font='400 22px system-ui,sans-serif';
    ctx.fillText(shotMeta(frames[i]),x+120,yy+hs[i]+38);
    ctx.fillStyle='#15181a'; ctx.font='400 22px system-ui,sans-serif';
    wrapText(ctx,frames[i].note||'',x,yy+hs[i]+74,cw,28,2);
  });
  cv.toBlob(b=>{download(b,'storyboard.png');toast('Sheet exported');},'image/png');
}

/* a compact Midtown-style grid: avenues, cross streets and a diagonal Broadway, with landmarks, sewers, steam and roadworks */
function nycState(){
  const R=rng32(1931), items=[], groups=[]; let id=1;

  /* landmarks */

  add('chrysler',{x:60,z:-80},gL);
  add('flatiron',{x:8.3,z:40.3,w:25,d:25,h:52},gL);
  add('subway',{x:21.9,z:-34},gL); add('subway',{x:-21.9,z:-8,rot:180},gL);
  const claimed=[[-80.8,-52.8,-39.2,-27.2],[47.5,-92.8,72.5,-67.2],[-4.2,27.2,20.8,52.8],[39.2,67.2,80.8,92.8],[-20.8,67.2,20.8,132]];
  /* civic square: town hall with its grand steps, a fountain, flags, trees and benches */

  [-9,9].forEach(x=>add('flagpole',{x,z:99,rot:90},gP));
  for(let z=100;z<=126;z+=8){[-17,17].forEach(x=>add('tree',{x,z,s:.95,color:'#4f8a3a'},gP));}
  [[-6,110,90],[6,110,-90],[0,116,180]].forEach(([x,z,r])=>add('bench',{x,z,rot:r},gP));

  const hit=(x0,z0,x1,z1)=>claimed.some(([a,b,c,d])=>x0<c&&x1>a&&z0<d&&z1>b);

  for(let i=0;i<xs.length-1;i++)for(let j=0;j<zs.length-1;j++){

  [[-33,-74],[33,6],[8,-61.5],[-60,22]].forEach(([x,z])=>add('steam',{x,z},gW));

  for(let k=0;k<6;k++) add('barrel',{x:-36.6,z:-78-k*2.4},gC);

  [[39.2,67.2,80.8,67.2],[80.8,67.2,80.8,92.8],[80.8,92.8,39.2,92.8],[39.2,92.8,39.2,67.2]].forEach(([a,b,c,d])=>add('fence',{x:a,z:b,x2:c,z2:d,h:2.4,color:'#5e4a35'},gC));
  add('dig',{x:60,z:80,w:30,d:16},gC);
  add('crane',{x:73,z:73,h:84},gC);
  add('shed',{x:60,z:53.9,w:30,d:2.2,h:3.2},gC);
  add('shed',{x:-81.9,z:-6,w:22,d:2.2,h:3.2,rot:90},gC);

function worldMaker(seed){

}

/* =====================================================================
   Autosave: everything is kept on this device and comes back next time
   ===================================================================== */
const AS_DB='storyboard-stage', AS_STORE='kv', AS_KEY='project', AS_LS='storyboard-stage-project';
let asDbP=null;
function idb(){
  if(!asDbP) asDbP=new Promise((res,rej)=>{
    if(!window.indexedDB) return rej(new Error('no indexedDB'));
    const r=indexedDB.open(AS_DB,1);
    r.onupgradeneeded=()=>r.result.createObjectStore(AS_STORE);
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
  return asDbP;
}
async function idbGet(k){const db=await idb();return new Promise((res,rej)=>{const q=db.transaction(AS_STORE,'readonly').objectStore(AS_STORE).get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}
async function idbSet(k,v){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction(AS_STORE,'readwrite');tx.objectStore(AS_STORE).put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}
function projectData(){return Object.assign({app:'storyboard-stage',v:4,savedAt:Date.now()},snapshot(),{frames});}
/* a project from a file or from autosave */
function applyProject(d){
  if(d.light&&typeof d.light==='object'&&d.light.key){Object.assign(L,JSON.parse(JSON.stringify(d.light)));applyLights();}
  applyState(d);
  frames=Array.isArray(d.frames)?d.frames:[];
  bv.sel=null; renderShots();
  hist.undo.length=0; hist.redo.length=0; hist.cur=sceneJSON(); syncUndoBtns();
}
let asT=null, asReady=false;
function autosave(now){
  if(!asReady) return;
  clearTimeout(asT);
  const go=()=>{
    let d; try{d=JSON.stringify(projectData());}catch(err){return;}
    idbSet(AS_KEY,d).catch(()=>{try{localStorage.setItem(AS_LS,d);}catch(err){toast('Could not save on this device. Use Save project.');}});
  };
  if(now) go(); else asT=setTimeout(go,1200);
}
['pointerup','change','click','keyup','input'].forEach(ev=>document.addEventListener(ev,()=>autosave()));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')autosave(true);});
window.addEventListener('pagehide',()=>autosave(true));
async function restoreAutosave(){
  let raw=null;
  try{raw=await idbGet(AS_KEY);}catch(err){}
  if(!raw){try{raw=localStorage.getItem(AS_LS);}catch(err){}}
  if(raw){
    try{const d=typeof raw==='string'?JSON.parse(raw):raw; if(d&&d.app==='storyboard-stage'){applyProject(d);toast('Welcome back. Your work was restored');}}
    catch(err){}
  }
  asReady=true;
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(err){}
}
window.__beforeUpdate=()=>autosave(true);
$('#verTxt').textContent='Version '+APP_VERSION+(HAS_AI?' · Claude':' · Phone app');
{const d=document.createElement('div');d.id='verInfo';$('#verLine').after(d);const upd=()=>{d.textContent=layoutInfo;};upd();window.addEventListener('resize',()=>setTimeout(upd,60));}
$('#verBtn').addEventListener('click',async()=>{
  if(!window.__checkUpdate){toast(HAS_AI?'The Claude version is always the latest':'Updates are checked automatically when the app opens');return;}
  toast('Checking for updates…');
  try{const found=await window.__checkUpdate(); toast(found?'Updating to the newest version…':'You have the newest version');}catch(err){toast('Could not check right now. Try again with internet');}
});
function newProject(){
  frames=[]; bv.sel=null;
  world.showRoom=false; world.groups=[]; rebuildWorld([newItem('room',0,0)]);
  clearChars(); addChar({name:'Alex',x:-.6,z:-.3,rot:25,pose:'stand'}); addChar({name:'Blake',x:.8,z:-.5,rot:-30,pose:'sit'}); sel=0;
  Object.assign(cam,{x:CAM_HOME.x,y:CAM_HOME.y,z:CAM_HOME.z,yaw:0,pitch:0,roll:0}); updateCamPose();
  setRoom(); fitDirector(); renderChips(); renderItemEditor(); renderItemList(); renderShots(); refreshUI();
  hist.undo.length=0; hist.redo.length=0; hist.cur=sceneJSON(); syncUndoBtns();
  autosave(true); toast('New project started');
}

/* =====================================================================
   Start
   ===================================================================== */
renderWorlds();
setRoom();
fitDirector();
world.showRoom=false; rebuildWorld([newItem('room',0,0)]);
addChar({name:'Alex',x:-.6,z:-.3,rot:25,pose:'stand'});
addChar({name:'Blake',x:.8,z:-.5,rot:-30,pose:'sit'});
sel=0;
updateShotCam(); renderChips(); renderItemList(); renderShots(); refreshUI();
setView('director');
setAppMode('direct',true);
resize();
hist.cur=sceneJSON(); syncUndoBtns();
restoreAutosave();
requestAnimationFrame(loop);
})();

<script>
/* offline support and updates: keep the app on the phone, and switch to a new version as soon as one is out */
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  const hadController=!!navigator.serviceWorker.controller; let reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(!hadController||reloading) return; reloading=true;
    try{if(window.__beforeUpdate)window.__beforeUpdate();}catch(err){}
    setTimeout(()=>location.reload(),600);
  });
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
      window.__checkUpdate=()=>reg.update().then(()=>!!(reg.installing||reg.waiting));
      document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reg.update().catch(()=>{});});
    }).catch(()=>{});
  });
}
</script>
